const $ = (s, r) => (r || document).querySelector(s);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Group inline comments into GitHub-style threads: a root (no in_reply_to_id)
// plus its replies. Each reply resolves to its thread's root by walking
// in_reply_to_id — GitHub flattens threads to one level, but chained ids
// resolve fine too. threadsByFile[path] holds each thread once, anchored by its
// root's line.
const commentsById = {};
((DATA.comments || {}).inline || []).forEach(c => { commentsById[c.id] = c; });
function threadRoot(c) {
  let cur = c, guard = 0;
  while (cur.in_reply_to_id && commentsById[cur.in_reply_to_id] && guard++ < 200)
    cur = commentsById[cur.in_reply_to_id];
  return cur;
}
const threadsByFile = {};
const threadsByRoot = new Map();
((DATA.comments || {}).inline || []).forEach(c => {
  const root = threadRoot(c);
  let t = threadsByRoot.get(root.id);
  if (!t) {
    t = { root, replies: [] };
    threadsByRoot.set(root.id, t);
    (threadsByFile[root.path] ||= []).push(t);
  }
  if (c !== root) t.replies.push(c);      // chronological (inline[] is by created_at)
});

// Composing is only possible when the branch has a PR to post against.
const canComment = !!(DATA.comments && DATA.comments.url);

// People the composer's @-autocomplete can offer (repo mentionables + everyone
// on the PR). Empty ⇒ attachMentions() is a no-op.
const MENTIONABLES = (DATA.comments || {}).mentionables || [];

// A row that hangs extra content (a comment, a composer) under a diff line.
// Empty ln/ln/sign gutter cells keep the payload in the code column, so it
// inherits that cell's left offset (indentation) and background — GitHub-style —
// instead of spanning the full table width.
function commentRow(node, anchorRow) {
  const tr = document.createElement('tr');
  tr.className = 'comment-row';
  // mirror the anchor line's diff tint (add/del) onto the gutter + background,
  // so the comment reads as belonging to that line
  if (anchorRow && anchorRow.classList.contains('add')) tr.classList.add('add');
  else if (anchorRow && anchorRow.classList.contains('del')) tr.classList.add('del');
  // One full-width cell (no separate gutter columns): the shared table columns
  // would otherwise indent the comment by the ln-gutter width, and a scrollport-
  // wide sticky payload would then overflow. colSpan spans the whole row so the
  // payload starts at the scrollport's left edge. The row's add/del tint stays.
  const td = el('td', 'code comment-cell');
  td.colSpan = 4;
  td.append(node);
  tr.append(td);
  return tr;
}

// Insert `tr` after `anchorRow` AND after any comment/composer rows already
// hanging off it, so multiple comments on one line stay in the order added
// (chronological) instead of each new one landing on top of the row.
function insertAfterAnchor(anchorRow, tr) {
  let at = anchorRow;
  while (at.nextElementSibling &&
         (at.nextElementSibling.classList.contains('comment-row') ||
          at.nextElementSibling.classList.contains('composer-row'))) {
    at = at.nextElementSibling;
  }
  at.after(tr);
}

function hunkRange(header) {
  const m = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))?/.exec(header || '');
  return m ? { o: +m[1], ol: +(m[2] ?? 1), n: +m[3], nl: +(m[4] ?? 1) } : null;
}

function commentInHunk(c, h) {
  const r = hunkRange(h.header);
  if (!r || c.line == null) return false;
  return c.side === 'LEFT' ? c.line >= r.o && c.line < r.o + r.ol
                           : c.line >= r.n && c.line < r.n + r.nl;
}

// Deterministic fallback color for an avatar when no image is available.
function avatarColor(name) {
  let h = 0;
  for (const ch of (name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360} 52% 46%)`;
}

// A round avatar: a colored initial with the real GitHub image layered over it,
// so an offline / 404 avatar degrades to the initial instead of a broken image.
function avatarEl(author, url, sm) {
  const av = el('div', 'comment-avatar' + (sm ? ' sm' : ''));
  av.style.background = avatarColor(author);
  av.append(el('span', 'comment-avatar-initial', (author || '?').slice(0, 1).toUpperCase()));
  if (url) {
    const img = el('img');
    img.src = url; img.alt = author; img.loading = 'lazy';
    img.onerror = () => img.remove();
    av.append(img);
  }
  return av;
}

// One comment: an avatar gutter + a main column (author/meta/tools header, then
// body). Edit/Delete/GitHub are quiet tools top-right; Reply is the thread's
// foot field (see threadBlock), so a card carries no bottom action strip.
function commentCard(c, note) {
  const d = el('div', 'comment');
  const main = el('div', 'comment-main');
  const head = el('div', 'comment-head');
  head.append(el('strong', 'comment-author', c.author));
  head.append(el('span', 'muted comment-meta',
    'commented ' + (c.created_at || '').slice(0, 10) + (note ? ' · ' + note : '')));
  const tools = el('div', 'comment-tools');
  const gh = el('a', 'comment-tool');
  gh.href = c.url; gh.target = '_blank'; gh.title = 'Open on GitHub';
  gh.innerHTML = FA_UP_RIGHT;
  tools.append(gh);
  // Edit/Delete render on every inline comment (id present) but are disabled
  // unless you authored it — GitHub only lets an author mutate their own, so
  // the buttons stay for a consistent tool cluster while making that clear.
  const viewer = (DATA.comments || {}).viewer;
  if (canComment && c.id) {
    const mine = viewer && c.author === viewer;
    const edit = el('button', 'comment-tool');
    edit.type = 'button'; edit.innerHTML = FA_PEN; edit.disabled = !mine;
    edit.title = mine ? 'Edit' : 'Only the author can edit';
    if (mine) edit.onclick = () => editComment(d, c);
    tools.append(edit);
    const del = el('button', 'comment-tool act-delete');
    del.type = 'button'; del.innerHTML = FA_TRASH; del.disabled = !mine;
    del.title = mine ? 'Delete' : 'Only the author can delete';
    if (mine) del.onclick = () => deleteComment(d, c, del);
    tools.append(del);
  }
  head.append(tools);
  const body = el('div', 'comment-body');
  if (c.body_html) body.innerHTML = c.body_html;
  else { body.textContent = c.body; body.style.whiteSpace = 'pre-wrap'; }
  main.append(head, body);
  d.append(avatarEl(c.author, c.avatar_url), main);
  return d;
}

// ---- Local notes: private, line-anchored, never sent to GitHub ------------
const notesByFile = {};
(DATA.notes || []).forEach(n => { (notesByFile[n.path] = notesByFile[n.path] || []).push(n); });

async function postNote(payload) {
  const res = await api('/api/add-note', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.detail || 'failed to save note');
  return j.note;
}

// A note reuses the comment card layout (.comment) with a purple theme, a
// pencil gutter instead of an avatar, a "you + Claude" pill, and a local-only
// foot — so it reads as a channel to Claude, never a PR post.
function noteCard(n) {
  const d = el('div', 'comment note');
  const main = el('div', 'comment-main');
  const head = el('div', 'comment-head');
  head.append(el('strong', 'comment-author note-label', 'Private note'));
  head.append(el('span', 'note-pill', 'you + Claude'));
  const tools = el('div', 'comment-tools');
  const edit = el('button', 'comment-tool');
  edit.type = 'button'; edit.innerHTML = FA_PEN; edit.title = 'Edit';
  edit.onclick = () => editNote(d, n);
  const del = el('button', 'comment-tool act-delete');
  del.type = 'button'; del.innerHTML = FA_TRASH; del.title = 'Delete';
  del.onclick = () => deleteNote(d, n, del);
  tools.append(edit, del);
  head.append(tools);
  const body = el('div', 'comment-body');
  body.textContent = n.body; body.style.whiteSpace = 'pre-wrap';
  main.append(head, body, el('div', 'note-meta', 'saved locally · Claude can act on it'));
  const gutter = el('div', 'note-gutter'); gutter.innerHTML = FA_PEN;
  d.append(gutter, main);
  return d;
}

function editNote(card, n) {
  if (card.querySelector('.comment-edit')) return;
  const bodyEl = card.querySelector('.comment-body');
  const tools = card.querySelector('.comment-tools');
  bodyEl.style.display = 'none';
  if (tools) tools.style.display = 'none';
  const restore = () => {
    box.remove(); bodyEl.style.display = '';
    if (tools) tools.style.display = '';
  };
  const box = composeBox({
    value: n.body, submitLabel: 'Save', onCancel: restore,
    onSubmit: async val => {
      const res = await api('/api/edit-note', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: n.id, body: val }),
      });
      const j = await res.json();
      if (!j.ok) throw new Error(j.detail || 'save failed');
      n.body = j.note.body; bodyEl.textContent = n.body; restore();
    },
  });
  box.classList.add('comment-edit', 'note-mode');
  bodyEl.after(box);
}

function deleteNote(card, n, btn) {
  armDelete(btn, async () => {
    const j = await (await api('/api/delete-note', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: n.id }),
    })).json();
    if (j.ok) {
      const arr = notesByFile[n.path];
      if (arr) arr.splice(arr.indexOf(n), 1);
      (card.closest('.comment-row') || card).remove();
    }
    return j;
  }, msg => card.querySelector('.comment-main').append(el('span', 'compose-error', msg)));
}

// Splice notes into a hunk body, anchored to their line — mirrors
// injectComments (notes carry the same {line, side}, so commentInHunk fits).
function injectNotes(body, file, h, rightOnly) {
  const ns = (notesByFile[file] || [])
    .filter(n => commentInHunk(n, h) && !(rightOnly && n.side === 'LEFT'));
  if (!ns.length) return;
  const rows = [...body.querySelectorAll('table.diff tr')];
  ns.forEach(n => {
    const lnIdx = n.side === 'LEFT' ? 0 : 1;
    const row = rows.find(r => {
      const cells = r.querySelectorAll('td.ln');
      return cells[lnIdx] && cells[lnIdx].textContent === String(n.line);
    });
    const tr = commentRow(noteCard(n), row);
    const tbody = body.querySelector('tbody');
    if (row) insertAfterAnchor(row, tr);
    else if (tbody) tbody.append(tr);
  });
}

// ---- Comment-count badges on collapsed headers ---------------------------
// A collapsed hunk/file/section hides any comments inside it; these counts
// surface that on the header (root + replies, per thread).
// counts exclude resolved threads — the badge means "unresolved discussion here"
function commentsInHunk(file, h) {
  return (threadsByFile[file] || [])
    .filter(t => !t.root.resolved && commentInHunk(t.root, h))
    .reduce((n, t) => n + 1 + (t.replies ? t.replies.length : 0), 0);
}
function commentsInFile(path) {
  return ((DATA.comments || {}).inline || [])
    .filter(c => c.path === path && !c.resolved).length;
}
function commentsInSection(sec) {
  let n = (sec.files || []).reduce((a, f) => a + commentsInFile(f), 0);
  (sec.extra_hunks || []).forEach(e => {
    const h = fileHunks(e.file).find(x => x.index === e.index);
    if (h) n += commentsInHunk(e.file, h);
  });
  return n;
}
function commentBadge(count) {
  if (!count) return null;
  const b = el('span', 'comment-badge');
  b.innerHTML = FA_COMMENTS;
  b.append(el('span', '', String(count)));
  b.title = count + (count === 1 ? ' comment' : ' comments') + ' here';
  return b;
}

// The @-mention token immediately left of the caret, or null. Triggers only at
// start-of-line or after whitespace, so email-style "foo@bar" never fires.
function activeMentionQuery(ta) {
  const m = /(?:^|\s)@([\w-]*)$/.exec(ta.value.slice(0, ta.selectionStart));
  return m ? m[1] : null;   // '' right after '@' (show everyone)
}

function matchMentions(q) {
  const ql = q.toLowerCase();
  if (!ql) return MENTIONABLES.slice(0, 8);   // already login-sorted server-side
  const rank = u => {
    const login = u.login.toLowerCase(), name = (u.name || '').toLowerCase();
    if (login.startsWith(ql)) return 0;
    if (name.startsWith(ql)) return 1;
    if (login.includes(ql) || name.includes(ql)) return 2;
    return 9;
  };
  return MENTIONABLES.map(u => [rank(u), u]).filter(r => r[0] < 9)
    .sort((a, b) => a[0] - b[0]).slice(0, 8).map(r => r[1]);
}

// Wire GitHub-style @-autocomplete onto a composer textarea. Keyboard-first:
// ↑/↓ move, Enter/Tab select, Esc closes. No-op when there's nobody to suggest.
function attachMentions(ta) {
  if (!MENTIONABLES.length) return;
  let menu = null, items = [], active = 0;

  const close = () => { if (menu) { menu.remove(); menu = null; items = []; } };

  const pick = u => {
    const caret = ta.selectionStart, q = activeMentionQuery(ta);
    if (q === null) return close();
    const atPos = caret - q.length - 1;            // index of the '@'
    const insert = '@' + u.login + ' ';
    ta.value = ta.value.slice(0, atPos) + insert + ta.value.slice(caret);
    const c = atPos + insert.length;
    ta.setSelectionRange(c, c);
    close();
    ta.focus();
  };

  const render = () => {
    const q = activeMentionQuery(ta);
    if (q === null) return close();
    items = matchMentions(q);
    if (!items.length) return close();
    if (active >= items.length) active = 0;
    if (!menu) { menu = el('div', 'mention-menu'); ta.parentNode.appendChild(menu); }
    menu.textContent = '';
    items.forEach((u, i) => {
      const row = el('div', 'mention-item' + (i === active ? ' active' : ''));
      row.append(el('span', 'mention-login', '@' + u.login));
      if (u.name) row.append(el('span', 'mention-name', u.name));
      row.addEventListener('mousedown', e => { e.preventDefault(); pick(u); });
      menu.appendChild(row);
    });
    menu.style.left = ta.offsetLeft + 'px';
    menu.style.top = (ta.offsetTop + ta.offsetHeight) + 'px';   // bottom-left of textarea
  };

  const move = d => {
    active = (active + d + items.length) % items.length;
    Array.from(menu.children).forEach((r, i) => r.classList.toggle('active', i === active));
    menu.children[active]?.scrollIntoView({ block: 'nearest' });
  };

  ta.addEventListener('input', () => { active = 0; render(); });
  // Capture phase so an open menu beats composeBox's own Enter/Esc handler.
  ta.addEventListener('keydown', e => {
    if (!menu) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); e.stopImmediatePropagation(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); move(-1); }
    else if (e.key === 'Enter' || e.key === 'Tab') {
      e.preventDefault(); e.stopImmediatePropagation(); pick(items[active]);
    } else if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); close(); }
  }, true);
  ta.addEventListener('blur', () => setTimeout(close, 120));   // let a click land first
}

// Shared compose widget: a textarea + Cancel/Comment, Cmd/Ctrl+Enter to submit,
// Esc to cancel. onSubmit(body) may throw to surface an inline error.
function composeBox({ submitLabel, value, onSubmit, onCancel }) {
  const box = el('div', 'compose');
  const ta = el('textarea');
  if (value) ta.value = value;
  const bar = el('div', 'compose-actions');
  bar.append(el('span', 'compose-hint', '⌘/Ctrl+Enter'));
  const cancel = el('button', 'compose-cancel', 'Cancel');
  const submit = el('button', 'compose-submit', submitLabel || 'Comment');
  cancel.onclick = () => onCancel();
  const send = async () => {
    const val = ta.value.trim();
    if (!val) return;
    submit.disabled = true;
    const label = submit.textContent;
    submit.textContent = 'Posting…';
    box.querySelector('.compose-error')?.remove();
    try {
      await onSubmit(val);
    } catch (e) {
      submit.disabled = false;
      submit.textContent = label;
      box.append(el('div', 'compose-error', String(e.message || e)));
    }
  };
  submit.onclick = send;
  ta.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
    else if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
  });
  bar.append(cancel, submit);
  box.append(ta, bar);
  attachMentions(ta);
  setTimeout(() => {
    ta.focus();
    if (value) ta.setSelectionRange(value.length, value.length);  // cursor at end
  }, 0);
  return box;
}

async function postComment(payload) {
  const res = await api('/api/add-comment', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.detail || 'failed to post comment');
  return j.comment;  // server also refreshes comments.json in the background
}

// Inline-edit a comment: swap its body for a composer prefilled with the source.
function editComment(card, c) {
  if (card.querySelector('.comment-edit')) return;   // already editing
  const bodyEl = card.querySelector('.comment-body');
  const tools = card.querySelector('.comment-tools');
  bodyEl.style.display = 'none';
  if (tools) tools.style.display = 'none';
  const restore = () => {
    edit.remove(); bodyEl.style.display = '';
    if (tools) tools.style.display = '';
  };
  const box = composeBox({
    value: c.body, submitLabel: 'Save', onCancel: restore,
    onSubmit: async val => {
      const res = await api('/api/edit-comment', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: c.id, body: val }),
      });
      const j = await res.json();
      if (!j.ok) throw new Error(j.detail || 'edit failed');
      c.body = j.comment.body; c.body_html = j.comment.body_html;
      if (c.body_html) bodyEl.innerHTML = c.body_html;
      else { bodyEl.textContent = c.body; bodyEl.style.whiteSpace = 'pre-wrap'; }
      restore();
    },
  });
  const edit = el('div', 'comment-edit');
  edit.append(box);
  bodyEl.after(edit);
}

// Two-click delete confirm (no native dialog), shared by comments and notes.
// First click floats a "✓1× ☐2×" step-hint above the trash and arms it (auto-
// disarms after 3s); the second click swaps the icon for a spinner and runs
// `perform`, which returns the parsed {ok,detail} (and does the on-success
// removal itself). `onFail(msg)` surfaces an error and restores the button.
function armDelete(btn, perform, onFail) {
  const disarm = () => {
    clearTimeout(btn._t);
    btn.dataset.armed = ''; btn.classList.remove('danger'); btn.title = 'Delete';
    btn.querySelector('.del-hint')?.remove();
  };
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1';
    btn.classList.add('danger');
    btn.title = 'Click again to delete';
    const hint = el('div', 'del-hint');
    hint.append(el('span', 'step done', '✓ 1×'), el('span', 'step todo', '☐ 2×'));
    btn.appendChild(hint);
    btn._t = setTimeout(disarm, 3000);
    return;
  }
  clearTimeout(btn._t);
  btn.querySelector('.del-hint')?.remove();
  btn.disabled = true;
  const icon = btn.innerHTML;                       // FA_TRASH, restored on error
  btn.innerHTML = '<span class="del-spin"></span>';
  const busy = el('div', 'del-hint');
  busy.append(el('span', 'step todo', 'Deleting…'));
  btn.appendChild(busy);
  const restore = msg => { btn.disabled = false; btn.innerHTML = icon; disarm(); onFail(msg); };
  Promise.resolve(perform())
    .then(j => { if (!j || !j.ok) restore((j && j.detail) || 'delete failed'); })
    .catch(e => restore(String(e.message || e)));
}

function deleteComment(card, c, btn) {
  armDelete(btn, async () => {
    const j = await (await api('/api/delete-comment', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: c.id }),
    })).json();
    if (j.ok) (card.closest('.comment-row') || card).remove();
    return j;
  }, msg => card.querySelector('.comment-main').append(el('span', 'compose-error', msg)));
}

// Open a composer under a diff line. side/line come from the clicked td.ln.
function addLineComposer(row, file, line, side) {
  // if a composer is already open in this line's comment block, focus it
  for (let s = row.nextElementSibling;
       s && (s.classList.contains('comment-row') || s.classList.contains('composer-row'));
       s = s.nextElementSibling) {
    if (s.classList.contains('composer-row')) { s.querySelector('textarea').focus(); return; }
  }
  // With a PR you choose the target; without one, notes are the only option.
  let target = canComment ? 'comment' : 'note';
  const box = composeBox({
    submitLabel: target === 'note' ? 'Add note' : 'Comment',
    onCancel: () => tr.remove(),
    onSubmit: async val => {
      if (target === 'note') {
        const n = await postNote({ path: file, line, side, body: val });
        (notesByFile[file] = notesByFile[file] || []).push(n);
        tr.replaceWith(commentRow(noteCard(n), row));
      } else {
        // wrap the new comment as a one-comment thread so it gets its reply foot
        const c = await postComment({ path: file, line, side, body: val });
        tr.replaceWith(commentRow(threadBlock({ root: c, replies: [] }, 'line ' + line), row));
      }
    },
  });
  const ta = box.querySelector('textarea');
  const submit = box.querySelector('.compose-submit');
  const applyTarget = t => {
    target = t;
    box.classList.toggle('note-mode', t === 'note');
    submit.textContent = t === 'note' ? 'Add note' : 'Comment';
    ta.placeholder = t === 'note'
      ? 'Note for yourself or Claude — never posted to GitHub'
      : 'Comment on this line…';
  };
  if (canComment) box.prepend(targetToggle(applyTarget));
  applyTarget(target);
  const tr = commentRow(box, row);
  tr.classList.add('composer-row');
  insertAfterAnchor(row, tr);
}

// Segmented [PR comment | Private note] control; calls onChange('comment'|'note').
function targetToggle(onChange) {
  const seg = el('div', 'compose-target');
  const mk = (val, label) => {
    const b = el('button', 'ct-opt'); b.type = 'button'; b.dataset.val = val;
    b.textContent = label;
    b.onclick = () => {
      seg.querySelectorAll('.ct-opt').forEach(o => o.classList.toggle('on', o === b));
      onChange(val);
    };
    return b;
  };
  const comment = mk('comment', 'PR comment');
  comment.classList.add('on');
  seg.append(comment, mk('note', 'Private note'));
  return seg;
}

// Resolve a numbered line-number cell to its composer target, or null.
// Left cell → old side (LEFT), right cell → new side (RIGHT). A delta-view body
// is snapshot→current, so its right side is still current-file numbering (LEFT
// isn't the base's, so it's refused below).
function lineTargetFromCell(cell) {
  const body = cell && cell.closest('.hunk-body');
  if (!body || !body.dataset.hunkFile) return null;
  const num = cell.textContent.trim();
  if (!/^\d+$/.test(num)) return null;
  const row = cell.closest('tr');
  const lns = [...row.querySelectorAll('td.ln')];
  const isLeft = lns.indexOf(cell) === 0;
  // Comment on the new (RIGHT) side. Only offer the old (LEFT) side on a pure
  // deletion (no right-hand line number), so context/modified rows don't show
  // two identical buttons side by side.
  if (isLeft && /^\d+$/.test((lns[1] ? lns[1].textContent : '').trim())) return null;
  // delta view old side = the reviewer's snapshot, not the base — not anchorable
  if (isLeft && body.dataset.delta) return null;
  const side = isLeft ? 'LEFT' : 'RIGHT';
  return { row, file: body.dataset.hunkFile, line: +num, side };
}

// The line gutter is always live: a note needs no PR. When a PR exists the
// composer offers comment-or-note; otherwise it's note-only. Clicking a
// commentable line-number cell opens the composer — the "+" hint is pure CSS
// (td.ln.commentable::after, revealed on row hover), so it lives inside the cell
// and can never strand when a hunk collapses.
document.addEventListener('click', e => {
  const t = e.target.closest && lineTargetFromCell(e.target.closest('td.ln'));
  if (t) addLineComposer(t.row, t.file, t.line, t.side);
});

// Tag the line cells an annotation can anchor to, so CSS shows the in-cell "+".
// Reuses lineTargetFromCell's new-side / pure-deletion eligibility, so context
// lines that can't take a comment stay bare. Called on each hunk as it hydrates.
function markCommentable(body) {
  body.querySelectorAll('td.ln').forEach(c => {
    if (lineTargetFromCell(c)) c.classList.add('commentable');
  });
  // Measure where the code's first character sits (past the ln/sign gutter,
  // whose width varies with the line-number digits) so comment payloads line up
  // with the code, not the file's left edge — feeds the .comment-cell rule.
  // ResizeObserver, not a one-shot: a file's hunks all hydrate together, so a
  // still-collapsed hunk here has a zero-size body; the observer re-measures the
  // moment it's expanded (and on window/font resize), when layout is real.
  const measure = () => {
    const codeCell = body.querySelector('td.code:not(.comment-cell)');
    const bodyRect = body.getBoundingClientRect();
    if (!codeCell || !bodyRect.width) return;   // collapsed / not laid out yet
    const cellRect = codeCell.getBoundingClientRect();
    const pad = parseFloat(getComputedStyle(codeCell).paddingLeft) || 0;
    const indent = Math.max(0, Math.round(cellRect.left - bodyRect.left + body.scrollLeft + pad));
    body.style.setProperty('--code-indent', indent + 'px');
    // the visible scrollport width (excludes any scrollbar) — caps comment width
    // without a CSS container (container-type nudged the body's height, adding a
    // stray vertical scrollbar)
    body.style.setProperty('--scrollport-w', body.clientWidth + 'px');
  };
  measure();
  new ResizeObserver(measure).observe(body);
}

let reconnecting = false;
function showReconnect() {
  if (DATA.preview) return;  // static preview render: no server to reconnect to
  if (reconnecting) return;
  reconnecting = true;
  const ov = el('div', 'reconnect-overlay');
  const box = el('div', 'reconnect-box');
  box.innerHTML = FA_REFRESH + ' Reconnecting…';
  ov.append(box);
  document.body.append(ov);
  let tries = 0;
  const probe = async () => {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      if (r.ok) { location.reload(); return; }
    } catch (e) { /* still down */ }
    // Keep probing so it auto-recovers if the server returns, but stop
    // pretending it's momentary: after ~15s it's stopped, not blinking —
    // say what to do about it (the server no longer restarts itself on drift).
    if (++tries === 7)
      box.textContent = 'Server stopped — ask Claude to restart the deskcheck server.';
    setTimeout(probe, 2000);
  };
  setTimeout(probe, 1000);
}

// all XHR goes through this: a connection failure flips the page into
// reconnect mode instead of silently doing nothing
async function api(url, opts) {
  try {
    return await fetch(url, opts);
  } catch (e) {
    showReconnect();
    throw e;
  }
}

function wipBadge(path) {
  const wip = (DATA.files[path] || {}).wip;
  if (!wip) return null;
  const s = el('span', 'wip', wip);
  s.title = 'This file has uncommitted changes — what you review may still move';
  return s;
}

const hunkKey = (file, h) => 'hunk:' + file + ':' + h.id;
const fileKey = f => 'file:' + f + ':' + ((DATA.files[f] || {}).hash || '');
const fileHunks = f => (DATA.files[f] || {}).hunks || [];
const findHunk = e => fileHunks(e.file).find(x => x.index === e.index);
// A file counts as reviewed when every one of its hunks is covered.
const fileReviewed = path => {
  const hunks = fileHunks(path);
  return hunks.length > 0 &&
    hunks.every(h => state[hunkKey(path, h)] || state[fileKey(path)]);
};

// A hunk counts as covered when it or its whole file is marked reviewed —
// progress display only; marking a file never writes hunk marks.
function coverEntries(sec) {
  const out = [];
  const add = (f, h) => out.push({
    key: hunkKey(f, h),
    covered: !!(state[hunkKey(f, h)] || state[fileKey(f)])
  });
  (sec.files || []).forEach(f => fileHunks(f).forEach(h => add(f, h)));
  (sec.extra_hunks || []).forEach(e => {
    const h = findHunk(e);
    if (h) add(e.file, h);
  });
  return out;
}

function dots(d) {
  const v = Math.max(1, Math.min(5, d || 1));
  return '●'.repeat(v) + '○'.repeat(5 - v);
}

async function toggle(key) {
  const res = await api('/api/toggle', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key })
  });
  const j = await res.json();
  state[j.key] = j.reviewed;
  document.querySelectorAll('[data-key]').forEach(n => {
    if (n.dataset.key === j.key) n.classList.toggle('collapsed', j.reviewed);
  });
  applyState();
}

// After a file collapses, keep its header in view so the page doesn't land in
// an arbitrary spot from the layout shift. block:'nearest' scrolls the
// minimum needed — zero when the header is already visible.
function scrollToCollapsed(btn, key) {
  if (!key.startsWith('file:') || !state[key]) return;
  const node = btn.closest('[data-key]');
  if (node) node.scrollIntoView({ block: 'nearest' });
}

function markBtn(key) {
  const b = el('button', 'mark');
  b.dataset.markFor = key;
  const level = key.split(':')[0];
  b.innerHTML = FA_CHECK;
  b.title = 'Mark ' + level + ' reviewed';
  b.onclick = async ev => {
    ev.stopPropagation();
    await toggle(key);
    scrollToCollapsed(b, key);
  };
  return b;
}

function collapsible(container, headerEl) {
  headerEl.onclick = () => container.classList.toggle('collapsed');
}

function ghFileLink(path) {
  if (!DATA.comments || !DATA.comments.url) return null;
  const a = el('a', 'gh-file-link');
  a.innerHTML = FA_UP_RIGHT;
  a.title = 'View on GitHub';
  a.target = '_blank';
  a.href = DATA.comments.url + '/files';
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(path)).then(buf => {
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    a.href = DATA.comments.url + '/files#diff-' + hex;
  });
  a.onclick = ev => ev.stopPropagation();
  return a;
}

function copyBtn(path) {
  const b = el('button', 'copy');
  b.title = 'Copy file path';
  b.innerHTML = FA_COPY;
  b.onclick = ev => {
    ev.stopPropagation();
    const done = () => {
      b.innerHTML = FA_CHECK;
      setTimeout(() => { b.innerHTML = FA_COPY; }, 1000);
    };
    navigator.clipboard.writeText(path).then(done, () => {
      const t = document.createElement('textarea');
      t.value = path;
      document.body.append(t);
      t.select();
      document.execCommand('copy');
      t.remove();
      done();
    });
  };
  return b;
}

const fileLoads = new Map();
function ensureFile(path) {
  if (!fileLoads.has(path)) {
    fileLoads.set(path, api('/api/filediff?path=' + encodeURIComponent(path))
      .then(r => r.json())
      .then(d => {
        document.querySelectorAll('.hunk-body').forEach(b => {
          if (b.dataset.hunkFile !== path) return;
          const h = d.hunks.find(x => x.id === b.dataset.hunkId);
          if (h) {
            b.innerHTML = h.html;
            b.style.minHeight = '';
            markCommentable(b);
            injectComments(b, path, h);
            injectNotes(b, path, h);
          }
        });
        addTrailingGap(path, d.total_new);
      })
      .catch(() => fileLoads.delete(path)));
  }
  return fileLoads.get(path);
}

const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) {
    io.unobserve(en.target);
    ensureFile(en.target.dataset.hunkFile);
  }
}), { rootMargin: '800px 0px' });

function hunkBlock(file, h, standalone, noMark) {
  const key = hunkKey(file, h);
  const div = el('div', standalone ? 'hunk standalone' : 'hunk');
  div.dataset.key = key;
  if (h.binary) {
    // no hunk chrome for binaries — just the declined-to-render note
    const body = el('div', 'hunk-body');
    body.dataset.hunkFile = file;
    body.dataset.hunkId = h.id;
    body.innerHTML = '<div class="empty">Loading…</div>';
    io.observe(body);
    div.append(body);
    return div;
  }
  const head = el('div', 'hunk-head');
  if (standalone) {
    head.append(el('code', 'file-path', file));
    const wb = wipBadge(file);
    if (wb) head.append(wb);
    const gl = ghFileLink(file);
    if (gl) head.append(gl);
    head.append(copyBtn(file));
  }
  head.append(el('code', 'hunk-header', h.header));
  const hunkCb = commentBadge(commentsInHunk(file, h));
  if (hunkCb) head.append(hunkCb);
  if (!noMark) head.append(markBtn(key));
  const body = el('div', 'hunk-body');
  body.dataset.hunkFile = file;
  body.dataset.hunkId = h.id;
  // Size the placeholder from the hunk's new-side line count so jumps and the
  // scrollbar are computed against near-real heights before content loads.
  const m = /\+\d+(?:,(\d+))?/.exec(h.header);
  body.style.minHeight = ((m ? +(m[1] || 1) : 8) * 18 + 10) + 'px';
  body.innerHTML = '<div class="empty">Loading diff…</div>';
  io.observe(body);
  div.append(head, body);
  collapsible(div, head);
  return div;
}

// GitHub-style anchoring: splice each comment into the diff table directly
// under the row for its line (new-side for RIGHT, old-side for LEFT).
// Render a thread as its root comment card plus indented reply cards.
function threadBlock(thread, rootNote) {
  const wrap = el('div', 'thread');
  if (thread.root.resolved) wrap.classList.add('resolved');
  // Always build the bar + inner; CSS shows the bar and hides the inner only
  // when .resolved (and .open re-expands). This makes resolve a pure class
  // toggle — no rebuild, no reload.
  const inner = el('div', 'thread-inner');
  inner.append(commentCard(thread.root, rootNote));
  const replies = el('div', 'thread-replies');   // left thread-line; hidden while empty
  thread.replies.forEach(r => {
    const card = commentCard(r);
    card.classList.add('reply');
    replies.append(card);
  });
  inner.append(replies);
  if (canComment && thread.root.id) inner.append(replyFoot(thread.root, replies, wrap));
  const count = 1 + thread.replies.length;
  const bar = el('div', 'resolved-bar');
  bar.innerHTML = FA_CHECK;
  bar.append(el('span', '', 'Resolved · ' + count + (count === 1 ? ' comment' : ' comments')));
  bar.onclick = () => wrap.classList.toggle('open');
  wrap.append(bar, inner);
  return wrap;
}

// The thread's reply affordance: a collapsed "Reply…" pill that expands into a
// composer. A posted reply appends to the thread's reply column (root threads
// are flat), then the field collapses back.
function replyFoot(root, replies, wrap) {
  const foot = el('div', 'thread-reply');
  const main = el('div', 'thread-reply-main');   // grows; holds the pill or composer
  const collapsed = el('div', 'thread-reply-collapsed');
  const cm = DATA.comments || {};
  collapsed.append(avatarEl(cm.viewer || '', cm.viewer_avatar, true));
  collapsed.append(el('div', 'thread-reply-pill', 'Reply…'));
  main.append(collapsed);
  const rb = resolveBtn(root, wrap);   // own row below; only when we have the thread id
  collapsed.onclick = () => {
    if (main.querySelector('.compose')) return;   // already expanded
    collapsed.style.display = 'none';
    if (rb) rb.style.display = 'none';   // resolving mid-reply is ambiguous — hide it
    const close = () => {
      box.remove(); collapsed.style.display = '';
      if (rb) rb.style.display = '';
    };
    const box = composeBox({
      submitLabel: 'Reply',
      onCancel: close,
      onSubmit: async val => {
        const reply = commentCard(await postComment({ in_reply_to: root.id, body: val }));
        reply.classList.add('reply');
        replies.append(reply);
        close();
      },
    });
    main.append(box);
  };
  foot.append(main);
  if (rb) foot.append(rb);
  return foot;
}

// Resolve / unresolve the whole thread via its GraphQL node id. Only shown when
// fetch_comments stamped a thread_id (i.e. resolution data is available). The
// toggle is in place and optimistic — no page reload.
function resolveBtn(root, wrap) {
  if (!root.thread_id) return null;
  const b = el('button', 'resolve-btn');
  b.type = 'button';
  const render = () => {
    b.classList.toggle('resolved', !!root.resolved);
    b.innerHTML = root.resolved ? FA_REFRESH : FA_CHECK;
    b.append(el('span', '', root.resolved ? 'Unresolve' : 'Resolve conversation'));
  };
  const apply = state => {          // flip data + the thread's collapse, in place
    root.resolved = state;
    wrap.classList.toggle('resolved', state);
    if (state) wrap.classList.remove('open');   // resolving tucks it into the bar
    render();
  };
  render();
  b.onclick = async () => {
    const target = !root.resolved;
    apply(target);                  // optimistic — instant, no reload
    b.disabled = true;
    try {
      const res = await api('/api/resolve-thread', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ thread_id: root.thread_id, resolved: target }),
      });
      if (!res.ok) {
        let detail = 'HTTP ' + res.status;
        try { const ej = await res.json(); if (ej && ej.detail) detail = ej.detail; }
        catch (_) { if (res.status === 404) detail += ' — rerun the skill to restart the server'; }
        throw new Error(detail);
      }
      const j = await res.json();
      if (!j.ok) throw new Error(j.detail || 'failed');
      b.disabled = false;
      // keep comments.json in sync for future reloads, and move our poll baseline
      // forward so this self-made change doesn't trigger a "New comments" pill
      api('/api/refresh-comments', { method: 'POST' }).then(async () => {
        try { const r = await (await api('/api/comments-rev')).json();
              if (r.rev) DATA.comments_rev = r.rev; } catch (_) {}
      }).catch(() => {});
    } catch (e) {
      apply(!target);               // revert the optimistic toggle
      b.disabled = false;
      const foot = b.closest('.thread-reply');
      if (foot) foot.append(el('span', 'compose-error', String(e.message || e)));
    }
  };
  return b;
}

// Splice each thread under its root's line (roots carry the anchor; replies
// ride along inside the thread block).
function injectComments(body, file, h, rightOnly) {
  const ts = (threadsByFile[file] || [])
    .filter(t => commentInHunk(t.root, h) && !(rightOnly && t.root.side === 'LEFT'));
  if (!ts.length) return;
  const rows = [...body.querySelectorAll('table.diff tr')];
  ts.forEach(t => {
    const c = t.root;
    const lnIdx = c.side === 'LEFT' ? 0 : 1;
    const row = rows.find(r => {
      const cells = r.querySelectorAll('td.ln');
      return cells[lnIdx] && cells[lnIdx].textContent === String(c.line);
    });
    const tr = commentRow(threadBlock(t, 'line ' + c.line), row);
    const tbody = body.querySelector('tbody');
    if (row) insertAfterAnchor(row, tr);
    else if (tbody) tbody.append(tr);
  });
}

// A collapsed run of unchanged lines between hunks (or file-start → first
// hunk). The descriptor lives on the .context-bar so the expand popover can act
// on it; revealed rows accumulate in .context-lines above the bar.
const CTX_CHUNK = 20;

function gapLabel(g) {
  const n = g.endNew - g.startNew + 1;
  return n + ' hidden line' + (n === 1 ? '' : 's');
}

function contextGap(path, gap) {
  const wrap = el('div', 'context-gap');
  const lines = el('div', 'context-lines');
  const bar = el('div', 'context-bar');
  bar._gap = { path, ...gap };
  const icon = el('span', 'context-icon');
  icon.innerHTML = FA_EXPAND;                        // the expand affordance, inline
  bar.append(icon, el('span', 'context-label', gapLabel(bar._gap)));
  bar.onclick = () => expandGap(bar);                // whole strip clickable
  wrap.append(lines, bar);
  return wrap;
}

// The trailing gap (last hunk → EOF) needs the file's total line count, which
// only arrives with the hydrated /api/filediff payload — so it's added here,
// once, and only when the last hunk doesn't already reach the end of the file.
function addTrailingGap(path, totalNew) {
  if (!totalNew) return;
  const hunks = fileHunks(path);
  const last = hunks.length && hunkRange(hunks[hunks.length - 1].header);
  if (!last) return;
  const startNew = last.n + last.nl;
  if (startNew > totalNew) return;                 // last hunk already at EOF
  const anyBody = [...document.querySelectorAll('.hunk-body')]
    .find(b => b.dataset.hunkFile === path);
  const fileBody = anyBody && anyBody.closest('.file-body');
  if (!fileBody || fileBody.querySelector('.context-gap.trailing')) return;
  const gap = contextGap(path, { startNew, startOld: last.o + last.ol, endNew: totalNew });
  gap.classList.add('trailing');
  const hunkDivs = fileBody.querySelectorAll(':scope > .hunk');
  const lastHunk = hunkDivs[hunkDivs.length - 1];
  if (lastHunk) lastHunk.after(gap); else fileBody.append(gap);
}

async function expandGap(bar) {
  const g = bar._gap;
  const room = Math.min(CTX_CHUNK, g.endNew - g.startNew + 1);
  if (room <= 0) return;
  let d;
  try {
    d = await (await api('/api/context?path=' + encodeURIComponent(g.path)
      + '&new_start=' + g.startNew + '&old_start=' + g.startOld
      + '&count=' + room)).json();
  } catch (e) { return; }
  const gapEl = bar.closest('.context-gap');
  if (!d.rows) { gapEl.remove(); return; }
  const tbl = el('table', 'diff');
  const tb = document.createElement('tbody');
  tb.innerHTML = d.rows;
  tbl.append(tb);
  gapEl.querySelector('.context-lines').append(tbl);
  const revealed = tb.children.length;
  g.startNew += revealed;
  g.startOld += revealed;
  // fully unfolded → drop only the "⋯" strip, keep the revealed lines in place
  if (g.startNew > g.endNew) bar.remove();
  else bar.querySelector('.context-label').textContent = gapLabel(g);
}

function fileBlock(path) {
  const hunks = fileHunks(path);
  if (!hunks.length) {
    // Sectioned but no longer differing from target — retired, not reviewable.
    const div = el('div', 'file gone');
    const head = el('div', 'file-head');
    head.append(el('code', 'file-path', path), el('span', 'muted', 'no longer in diff'));
    div.append(head);
    return div;
  }
  const key = 'file:' + path + ':' + ((DATA.files[path] || {}).hash || '');
  const div = el('div', 'file');
  div.dataset.key = key;
  const head = el('div', 'file-head');
  head.append(el('code', 'file-path', path));
  const wb = wipBadge(path);
  if (wb) head.append(wb);
  const gl = ghFileLink(path);
  if (gl) head.append(gl);
  head.append(copyBtn(path));
  const fileCb = commentBadge(commentsInFile(path));
  if (fileCb) head.append(fileCb);
  const staleMark = Object.keys(state).some(k =>
    k.startsWith('file:' + path + ':') && k !== key && state[k]);
  const isStale = staleMark && !state[key];
  if (isStale) head.append(el('span', 'stale', 'changed since review'));
  // A brand-new single-hunk file, or a binary: file and hunk are the same
  // review unit — the file button does both and the hunk button is suppressed.
  const r0 = hunkRange(hunks[0].header);
  const newSingle = hunks.length === 1 && r0 && r0.o === 0 && r0.ol === 0;
  const isBinary = hunks.length === 1 && hunks[0].binary;
  const single = newSingle || isBinary;
  const label = el('span', 'muted');
  if (newSingle) { label.innerHTML = FA_NEW_FILE; label.title = 'new file'; }
  else if (isBinary) label.textContent = 'binary';
  else label.textContent = hunks.length + (hunks.length === 1 ? ' hunk' : ' hunks');
  head.append(label);
  const mb = markBtn(key);
  if (single) {
    const hk = hunkKey(path, hunks[0]);
    mb.onclick = async ev => {
      ev.stopPropagation();
      await toggle(key);
      if (!!state[hk] !== !!state[key]) await toggle(hk);
      scrollToCollapsed(mb, key);
    };
  }
  head.append(mb);
  const body = el('div', 'file-body');
  // Interleave expandable gaps: file-start → first hunk, and between hunks.
  // Both are bounded by the hunk headers (old/new advance together in unchanged
  // regions, so the leading gap starts at old 1 / new 1). The trailing gap
  // (last hunk → EOF) is added later in addTrailingGap(), once hydration reveals
  // the file's total line count.
  hunks.forEach((h, i) => {
    const cur = hunkRange(h.header);
    if (i === 0) {
      if (cur && cur.n > 1)
        body.append(contextGap(path, { startNew: 1, startOld: 1, endNew: cur.n - 1 }));
    } else {
      const prev = hunkRange(hunks[i - 1].header);
      if (cur && prev && cur.n - 1 >= prev.n + prev.nl)
        body.append(contextGap(path, {
          startNew: prev.n + prev.nl, startOld: prev.o + prev.ol, endNew: cur.n - 1 }));
    }
    body.append(hunkBlock(path, h, false, single));
  });
  (threadsByFile[path] || [])
    .filter(t => !hunks.some(h => commentInHunk(t.root, h)))
    .forEach(t => body.append(threadBlock(t,
      t.root.line ? 'line ' + t.root.line + ', outside current diff' : 'file comment')));
  // notes whose line left the visible diff still surface, so none silently vanish
  (notesByFile[path] || [])
    .filter(n => !hunks.some(h => commentInHunk(n, h)))
    .forEach(n => body.append(noteCard(n)));
  if (isStale) {
    // show only what changed since the reviewer's mark-time snapshot,
    // with a toggle back to the full diff
    const bar = el('div', 'delta-bar');
    bar.append(el('span', '', 'Showing changes since your review'));
    const tog = el('button', 'delta-toggle');
    const setTogLabel = on => tog.innerHTML = FA_DIFF + '<span>'
      + (on ? 'Show full diff' : 'Show changes since review') + '</span>';
    setTogLabel(true);
    tog.onclick = ev => {
      ev.stopPropagation();
      setTogLabel(div.classList.toggle('delta-mode'));
    };
    bar.append(tog);
    const deltaBody = el('div', 'delta-body');
    deltaBody.innerHTML = '<div class="empty">Loading changes since your review…</div>';
    div.classList.add('delta-mode');
    div.append(head, bar, deltaBody, body);
    if (DATA.preview)
      deltaBody.innerHTML = '<div class="empty">Changes-since-review diff '
        + 'renders from the server.</div>';
    else
    api('/api/reviewdelta?path=' + encodeURIComponent(path))
      .then(r => r.json())
      .then(d => {
        if (!d.available) {
          div.classList.remove('delta-mode');
          bar.remove();
          deltaBody.remove();
          return;
        }
        deltaBody.innerHTML = '';
        if (!d.hunks.length) {
          deltaBody.append(el('div', 'empty',
            'No content changes since your review — only its position in the diff moved.'));
          return;
        }
        d.hunks.forEach(h => {
          const hb = el('div', 'delta-hunk');
          const hh = el('div', 'hunk-head');
          hh.append(el('code', 'hunk-header', h.header));
          const hbody = el('div', 'hunk-body');
          hbody.dataset.hunkFile = path;
          hbody.dataset.delta = '1';
          hbody.innerHTML = h.html;
          markCommentable(hbody);
          // right side only: the delta's old side is the snapshot, not the base
          injectComments(hbody, path, h, true);
          injectNotes(hbody, path, h, true);
          hb.append(hh, hbody);
          deltaBody.append(hb);
        });
      })
      .catch(() => {
        div.classList.remove('delta-mode');
        bar.remove();
        deltaBody.remove();
      });
  } else {
    div.append(head, body);
  }
  collapsible(div, head);
  return div;
}

function sectionBlock(sec) {
  const key = 'section:' + sec.id;
  const wrap = el('section', 'sec');
  wrap.dataset.key = key;
  wrap.id = 'sec-' + sec.id;
  const head = el('div', 'sec-head');
  head.append(el('h2', '', sec.title));
  head.append(el('span', 'dots', dots(sec.difficulty)));
  const secCb = commentBadge(commentsInSection(sec));
  if (secCb) head.append(secCb);
  const body = el('div', 'sec-body');
  if (sec.summary) body.append(el('p', 'summary', sec.summary));

  // Module map — filled in async by loadDiagrams() from /api/diagrams.
  // collapsed by default — the map is orientation, not the review itself
  const diagram = el('details', 'section-diagram');
  diagram.dataset.secId = sec.id;
  const dbody = el('div', 'diagram-body');
  dbody.append(el('div', 'diagram-loading', 'Generating module map…'));
  const dsum = el('summary');
  dsum.append(el('span', '', 'Module map'));
  diagram.append(dsum, dbody);
  body.append(diagram);

  // The diagram above is the section's file index now (clickable, hunk counts),
  // so the old "N files" list/toggle is gone — just render the diffs.
  (sec.files || []).forEach(f => body.append(fileBlock(f)));
  (sec.extra_hunks || []).forEach(e => {
    const h = findHunk(e);
    if (!h) return;
    body.append(hunkBlock(e.file, h, true));
  });

  head.append(markBtn(key));

  wrap.append(head, body);
  collapsible(wrap, head);
  return wrap;
}

function jumpToFile(secId, path) {
  const sec = document.getElementById('sec-' + secId);
  sec.classList.remove('collapsed');
  const target = [...sec.querySelectorAll('.file, .hunk.standalone')].find(n =>
    n.querySelector('.file-path')?.textContent === path);
  if (target) {
    target.classList.remove('collapsed');  // expand it if collapsed (e.g. reviewed)
    target.scrollIntoView();
  }
}

// The module maps are built in the background (server spawns diagram.py), so
// poll /api/diagrams until they land, then render each section's graph in place.
// diagram.py writes all sections at once (atomic), so a non-empty response is
// complete — sections with no entry never get one and shed their placeholder.
async function loadDiagrams() {
  if (DATA.preview || typeof mermaid === 'undefined') {
    document.querySelectorAll('.section-diagram').forEach(n => n.remove());
    return;
  }
  mermaid.initialize({
    startOnLoad: false, securityLevel: 'loose', theme: 'base',
    flowchart: { htmlLabels: true, curve: 'basis', padding: 8 },
    themeVariables: {
      fontFamily: "'Cousine', ui-monospace, monospace", fontSize: '12px',
      primaryColor: '#ffffff', primaryBorderColor: '#d1d9e0',
      primaryTextColor: '#1f2328', lineColor: '#59636e',
      clusterBkg: '#f6f8fa', clusterBorder: '#d1d9e0',
    },
  });
  for (let tries = 0; tries < 20; tries++) {
    let sections = null;
    try {
      sections = (await (await api('/api/diagrams')).json()).sections;
    } catch (e) { /* server briefly away; retry */ }
    if (sections && Object.keys(sections).length) {
      document.querySelectorAll('.section-diagram').forEach(c => {
        const d = sections[c.dataset.secId];
        if (d && d.mermaid) renderDiagram(c, d.mermaid, d.nodes || {}, d.untested || []);
        else c.remove();
      });
      return;
    }
    await new Promise(r => setTimeout(r, 1500));
  }
  document.querySelectorAll('.section-diagram').forEach(n => n.remove());
}

async function renderDiagram(container, def, nodes, untested) {
  try {
    const secId = container.dataset.secId;
    const id = 'mmd-' + secId.replace(/[^a-zA-Z0-9_-]/g, '_');
    const { svg } = await mermaid.render(id, def);
    const box = container.querySelector('.diagram-body');
    box.innerHTML = svg;
    // Render at the diagram's natural size so labels stay legible; the container
    // scrolls (overflow:auto) when a many-file section makes the graph wider or
    // taller than the panel. Mermaid emits width="100%" + max-width:<natural>px,
    // which otherwise *shrinks* the whole graph — text and all — to fit, going
    // unreadable past ~10 nodes. Pin the intrinsic px from the viewBox to opt out.
    const svgEl = container.querySelector('svg');
    const vb = svgEl && svgEl.viewBox.baseVal;
    if (vb && vb.width) {
      svgEl.style.maxWidth = 'none';
      svgEl.style.width = Math.ceil(vb.width) + 'px';
      svgEl.style.height = Math.ceil(vb.height) + 'px';
    }
    const untestedSet = new Set(untested);
    // Per node, off the element id (…-flowchart-<nodeId>-<n>) — stable across
    // Mermaid 10/11, unlike the version-fragile `click … call` binding.
    container.querySelectorAll('g.node').forEach(g => {
      const m = (g.id || '').match(/flowchart-(n\d+)-\d+$/);
      if (!m) return;
      const nodeId = m[1];
      const path = nodes[nodeId];
      if (path) {                                   // click jumps to the diff
        g.classList.add('clickable');
        g.addEventListener('click', () => jumpToFile(secId, path));
      }
      if (untestedSet.has(nodeId)) markNoTest(g);   // progressive enhancement
    });
  } catch (e) {
    container.remove();  // an unrenderable graph shouldn't leave a stuck spinner
  }
}

// Pin a circular "no test" avatar to the node's top-left corner. Drawn as an
// SVG group in the node's own coordinate space, so it stays put through
// Mermaid's viewBox scaling and never touches the label's flow. Best-effort: if
// the node shape ever changes, the node still renders (and keeps its dashed
// border) — the avatar is enhancement, not load-bearing.
const SVGNS = 'http://www.w3.org/2000/svg';
function markNoTest(g) {
  try {
    if (g.querySelector('.no-test-avatar')) return;
    const rect = g.querySelector('rect');
    if (!rect) return;  // needs a box to sit on
    // pin to the box's top-left corner (rect origin attrs; centered nodes are
    // at -w/2,-h/2). Centering the circle on the corner straddles it, keeping
    // the avatar clear of the label even when a long name nearly fills the box.
    const w = parseFloat(rect.getAttribute('width'));
    const h = parseFloat(rect.getAttribute('height'));
    const x = rect.getAttribute('x') != null ? parseFloat(rect.getAttribute('x')) : -w / 2;
    const y = rect.getAttribute('y') != null ? parseFloat(rect.getAttribute('y')) : -h / 2;
    const r = 10, isz = 13, cx = x, cy = y;
    const svg = (tag, attrs, styles) => {
      const n = document.createElementNS(SVGNS, tag);
      for (const k in attrs) n.setAttribute(k, attrs[k]);
      // Mermaid's stylesheet fills node <circle>/<path> — inline !important wins.
      for (const k in styles) n.style.setProperty(k, styles[k], 'important');
      return n;
    };
    // no pointer-events:none — the avatar needs hover for its <title> tooltip;
    // clicks still bubble to the node's jump handler since it's a child of it
    const avatar = svg('g', { class: 'no-test-avatar' });
    const box = svg('svg', { x: cx - isz / 2, y: cy - isz / 2, width: isz,
                             height: isz, viewBox: '0 0 640 640' });
    box.append(svg('path', { d: ICON_NO_TEST_D }, { fill: '#ffffff' }));
    const title = svg('title', {});  // native tooltip on hover
    title.textContent = 'No test found for this module';
    // stroke:none overrides Mermaid's default node <circle> border
    avatar.append(title,
      svg('circle', { cx, cy, r }, { fill: '#bf8700', stroke: 'none' }), box);
    g.append(avatar);  // last child → paints on top of the box + label
  } catch (e) { /* enhancement only */ }
}

// Group a flat path list into a nested {dirs, files} tree. No dependency —
// splitting paths on "/" is the whole job.
function fileTree(paths) {
  const root = { dirs: {}, files: [] };
  for (const p of paths) {
    const parts = p.split('/');
    const name = parts.pop();
    let node = root;
    for (const dir of parts) {
      node.dirs[dir] = node.dirs[dir] || { dirs: {}, files: [] };
      node = node.dirs[dir];
    }
    node.files.push({ name, path: p });
  }
  return root;
}

// Render dirs (folder rows) then files (clickable leaves), indented by depth.
// Single-child dir chains collapse into one row (src/components/…), GitHub-style.
function renderTree(node, sec, wrap, depth) {
  const pad = d => (d * 12 + 4) + 'px';
  for (let [name, child] of Object.entries(node.dirs)) {
    let label = name;
    while (Object.keys(child.dirs).length === 1 && child.files.length === 0) {
      const [n, c] = Object.entries(child.dirs)[0];
      label += '/' + n; child = c;
    }
    const d = el('div', 'nav-dir');
    d.style.paddingLeft = pad(depth);
    d.innerHTML = FA_FOLDER_OPEN;
    d.append(el('span', '', label));
    wrap.append(d);
    renderTree(child, sec, wrap, depth + 1);
  }
  for (const f of node.files) {
    const item = el('div', 'nav-file');
    item.dataset.fileReview = f.path;
    item.style.paddingLeft = (depth * 12 + 12) + 'px'; // +8 over pad(): files have no leading icon, align under folder labels
    item.title = f.path;
    item.append(el('span', 'nf-name', f.name));
    item.insertAdjacentHTML('beforeend', FA_CHECK);
    item.onclick = ev => { ev.stopPropagation(); jumpToFile(sec.id, f.path); };
    wrap.append(item);
  }
}

function navItem(sec) {
  const a = el('a', 'nav-item');
  a.dataset.navFor = 'section:' + sec.id;
  const t = el('div', 't', sec.title);
  const row = el('div', 'nav-title-row');
  row.append(t);
  row.insertAdjacentHTML('beforeend', FA_CHECK);
  a.append(row);
  const meta = el('div', 'meta');
  meta.append(el('span', 'dots', dots(sec.difficulty)));
  meta.append(el('span', 'prog', ''));
  a.append(meta);
  const bar = el('div', 'bar');
  bar.append(el('i', ''));
  a.append(bar);
  const filesWrap = el('div', 'nav-files');
  const paths = [...(sec.files || [])];
  (sec.extra_hunks || []).forEach(e => {
    if (!paths.includes(e.file)) paths.push(e.file);
  });
  renderTree(fileTree(paths), sec, filesWrap, 0);
  a.append(filesWrap);
  a.onclick = () => {
    // accordion: opening this section's file list closes any other open one
    const opening = !a.classList.contains('files-open');
    document.querySelectorAll('.nav-item.files-open')
      .forEach(n => n.classList.remove('files-open'));
    if (opening) a.classList.add('files-open');
    const s = document.getElementById('sec-' + sec.id);
    s.classList.remove('collapsed');
    s.scrollIntoView();
  };
  return a;
}

function applyState() {
  document.querySelectorAll('[data-key]').forEach(n =>
    n.classList.toggle('reviewed', !!state[n.dataset.key]));
  document.querySelectorAll('[data-mark-for]').forEach(b =>
    b.classList.toggle('on', !!state[b.dataset.markFor]));
  document.querySelectorAll('[data-file-review]').forEach(n =>
    n.classList.toggle('reviewed', fileReviewed(n.dataset.fileReview)));
  const overall = new Map();
  DATA.sections.forEach(sec => {
    const entries = coverEntries(sec);
    entries.forEach(en => overall.set(en.key, overall.get(en.key) || en.covered));
    const done = entries.filter(en => en.covered).length;
    const item = document.querySelector('[data-nav-for="section:' + sec.id + '"]');
    if (!item) return;
    item.classList.toggle('done', !!state['section:' + sec.id]);
    $('.prog', item).textContent = done + '/' + entries.length;
    $('.bar i', item).style.width = entries.length ? (100 * done / entries.length) + '%' : '0';
  });
  const doneAll = [...overall.values()].filter(Boolean).length;
  $('#overall').textContent = doneAll + ' of ' + overall.size + ' hunks reviewed';
  const badge = $('#fully-reviewed');
  const done = branchFullyReviewed(state);
  if (!badge.dataset.init) {  // build once so the width transition survives updates
    badge.dataset.init = '1';
    badge.innerHTML = '<span class="fr-label">In Review</span>'
                    + '<span class="fr-check">' + FA_CHECK + '</span>';
  }
  badge.classList.toggle('on', done);
}

// Fully reviewed = the changed-file list matches sections.json (the server
// injects an "_unsectioned" section whenever it doesn't) AND every hunk of
// every changed file is covered by its own mark or its file's mark.
function branchFullyReviewed(st) {
  if (DATA.sections.some(s => s.id === '_unsectioned')) return false;
  let any = false;
  for (const p of Object.keys(DATA.files)) {
    for (const h of fileHunks(p)) {
      any = true;
      if (!st[hunkKey(p, h)] && !st[fileKey(p)]) return false;
    }
  }
  return any;
}

function build() {
  document.title = DATA.title || 'PR Review';
  $('#title').textContent = DATA.title || 'PR Review';
  $('#sub').textContent = (DATA.branch || 'HEAD') + ' → ' + DATA.target;
  if (DATA.comments && DATA.comments.url) {
    // PR link lives at the far right of the top bar (most critical)
    const a = el('a', 'pr-link');
    a.innerHTML = '<span>PR #' + DATA.comments.pr + '</span>' + FA_UP_RIGHT;
    a.href = DATA.comments.url;
    a.target = '_blank';
    $('.tb-right').append(a);
  }
  DATA.sections.forEach(sec => {
    $('#sections-nav').append(navItem(sec));
    $('#content').append(sectionBlock(sec));
  });
  const cm = DATA.comments;
  if (cm && (cm.conversation || []).length) {
    const wrap = el('section', 'sec conv collapsed');
    const head = el('div', 'sec-head');
    head.append(el('h2', '', 'PR #' + cm.pr + ' conversation'));
    head.append(el('span', 'muted', cm.conversation.length + ' comments'));
    // refresh comments lives with the comments now, not the top bar
    const btn = el('button', 'refresh');
    btn.innerHTML = FA_REFRESH;
    btn.title = 'Refresh comments';
    btn.onclick = async ev => {
      ev.stopPropagation();  // don't toggle the section
      btn.disabled = true;
      btn.classList.add('busy');
      try {
        const r = await (await api('/api/refresh-comments', { method: 'POST' })).json();
        if (r.ok) { location.reload(); return; }
      } catch (e) { /* fall through to reset */ }
      btn.disabled = false;
      btn.classList.remove('busy');
    };
    head.append(btn);
    const pill = el('button', 'new-comments', 'New comments — reload');
    pill.style.display = 'none';
    pill.onclick = () => location.reload();
    const body = el('div', 'sec-body');
    cm.conversation.forEach(c => body.append(commentCard(c)));
    wrap.append(head, pill, body);
    collapsible(wrap, head);
    $('#content').prepend(wrap);
    setInterval(async () => {
      try {
        const r = await (await api('/api/comments-rev')).json();
        if (r.rev && r.rev !== DATA.comments_rev) pill.style.display = '';
      } catch (e) { /* server briefly away; try again next tick */ }
    }, 30000);
  }
  document.querySelectorAll('[data-key]').forEach(n => {
    if (state[n.dataset.key]) n.classList.add('collapsed');
  });
  applyState();
  trackStickyOffsets();
  // files with inline comments or notes load eagerly so they're visible
  new Set([...Object.keys(threadsByFile), ...Object.keys(notesByFile)]).forEach(ensureFile);
}

// Nested sticky headers park below their section header. Measure its real
// height into --sec-h per section instead of hard-coding it, so a font swap,
// padding tweak, or wrapping title can't desync the offset.
function trackStickyOffsets() {
  document.querySelectorAll('.sec').forEach(sec => {
    const head = sec.querySelector(':scope > .sec-head');
    if (!head) return;
    const set = () => sec.style.setProperty('--sec-h', head.offsetHeight + 'px');
    set();
    new ResizeObserver(set).observe(head);
  });
}
// ---- Keyboard navigation -------------------------------------------------
// Focus can land on any reviewable node — a section, file, or hunk — all of
// which carry data-key and collapse the same way. j/k walk hunks (the reading
// flow); [/] walk sections. Collapsing only hides a *-body (heads stay in
// layout), so offsetParent cleanly excludes nodes inside a collapsed ancestor.
let kbdFocus = null;

const visible = sel => [...document.querySelectorAll(sel)].filter(n => n.offsetParent);

function nearestToTop(list) {
  let best = list[0], bestD = Infinity;
  for (const n of list) {
    const d = Math.abs(n.getBoundingClientRect().top);
    if (d < bestD) { bestD = d; best = n; }
  }
  return best;
}

function setKbdFocus(n) {
  if (kbdFocus) kbdFocus.classList.remove('kbd-focus');
  kbdFocus = n;
  if (n) { n.classList.add('kbd-focus'); n.scrollIntoView({ block: 'center' }); }
}

// Step through `list`, skipping items already reviewed — you land on the next
// thing that still needs review. The first press anchors on the nearest open
// item; if nothing's open ahead, stay put rather than jump onto a reviewed one.
function step(list, dir, cur) {
  if (!list.length) return;
  const open = n => !n.classList.contains('reviewed');
  const i = cur ? list.indexOf(cur) : -1;
  if (i >= 0) {                       // cur is still on-screen: walk from its slot
    for (let j = i + dir; j >= 0 && j < list.length; j += dir)
      if (open(list[j])) return setKbdFocus(list[j]);
    return;
  }
  // cur left the visible list — it was just marked and collapsed out of view (a
  // single-hunk file collapses the whole file). Advance from cur's DOM position
  // in reading order, NOT to the geometrically nearest open hunk: after the
  // collapse the nearest one can be deeper in the next section, so 'm' would skip
  // past that section's first hunk. compareDocumentPosition still works because a
  // collapsed node stays in the DOM.
  if (cur) {
    const want = dir > 0 ? Node.DOCUMENT_POSITION_FOLLOWING
                         : Node.DOCUMENT_POSITION_PRECEDING;
    const ordered = dir > 0 ? list : [...list].reverse();
    const next = ordered.find(n => open(n) && (cur.compareDocumentPosition(n) & want));
    return next && setKbdFocus(next);
  }
  const first = nearestToTop(list.filter(open));   // first-ever press: no anchor
  return first && setKbdFocus(first);
}

// first unreviewed visible <sel> inside a container — used to dive from a
// coarser focus into its next child
const firstOpenIn = (container, sel) =>
  visible(sel).find(n => container.contains(n) && !n.classList.contains('reviewed'));

// Going forward to a finer level while focused on a coarser container descends
// into that container's first unreviewed child, rather than jumping to the
// nearest one on screen. Otherwise step through siblings at this level.
const moveHunk = dir => {
  if (dir > 0 && kbdFocus && !kbdFocus.classList.contains('hunk')) {
    const child = firstOpenIn(kbdFocus, '.hunk');   // a section or file → its first hunk
    if (child) return setKbdFocus(child);
  }
  step(visible('.hunk'), dir, kbdFocus);
};
// [/] step whole files. ] from a section dives into its first file (descend);
// [ from a hunk pops up to its containing file (ascend); otherwise sibling files.
const moveFile = dir => {
  if (dir > 0 && kbdFocus?.classList.contains('sec')) {
    const child = firstOpenIn(kbdFocus, '.file');
    if (child) return setKbdFocus(child);
  }
  if (dir < 0 && kbdFocus?.classList.contains('hunk')) {
    const parent = kbdFocus.closest('.file');
    if (parent) return setKbdFocus(parent);
  }
  step(visible('.file'), dir, kbdFocus && kbdFocus.closest('.file'));
};
// {/} step sections (rarer, so the shifted keys). { from a hunk/file pops up to
// its containing section (ascend); otherwise sibling sections.
const moveSection = dir => {
  if (dir < 0 && kbdFocus && !kbdFocus.classList.contains('sec')) {
    const parent = kbdFocus.closest('.sec');
    if (parent) return setKbdFocus(parent);
  }
  step(visible('.sec'), dir, kbdFocus && (kbdFocus.closest('.sec')));
};

// A node's own mark button (data-mark-for === its key) — not a descendant's.
function ownMark(n) {
  return n.querySelector('.mark[data-mark-for="' + CSS.escape(n.dataset.key || '') + '"]')
      || n.querySelector('.mark');
}

async function markCurrent() {
  const hunks = visible('.hunk');
  if (!kbdFocus) return hunks.length && setKbdFocus(nearestToTop(hunks));
  // fall back to the containing file's (then section's) mark when the focused
  // hunk has none of its own — single-hunk files and binaries render no hunk
  // mark button, and that hunk is covered by the file mark anyway, so 'm' would
  // otherwise be a dead key there
  const btn = ownMark(kbdFocus)
    || (kbdFocus.closest('.file') && ownMark(kbdFocus.closest('.file')))
    || (kbdFocus.closest('.sec') && ownMark(kbdFocus.closest('.sec')));
  const advanceHunk = kbdFocus.classList.contains('hunk');
  // 'm' always marks reviewed — never toggles back off. Await the toggle so the
  // item finishes collapsing (and the layout reflows) BEFORE we advance —
  // otherwise the jump scrolls against the old layout and lands slightly off.
  if (btn && !btn.classList.contains('on')) await toggle(btn.dataset.markFor);
  if (advanceHunk) moveHunk(1);  // next unreviewed hunk, on the settled layout
}

// Space collapses/expands the focused node without touching its reviewed mark —
// same class the header click toggles.
function toggleCollapse() {
  const hunks = visible('.hunk');
  if (!kbdFocus) return hunks.length && setKbdFocus(nearestToTop(hunks));
  kbdFocus.classList.toggle('collapsed');
}

function toggleKbdHelp(force) { $('#kbd-overlay').classList.toggle('open', force); }

function initKeyboard() {
  $('#kbd-btn').onclick = () => toggleKbdHelp();
  $('#kbd-overlay').onclick = e => { if (e.target.id === 'kbd-overlay') toggleKbdHelp(false); };
  document.addEventListener('keydown', e => {
    // never hijack typing (comment/reply composers) or browser/OS chords
    const t = e.target;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))) return;
    const open = $('#kbd-overlay').classList.contains('open');
    if (e.key === 'Escape') {
      if (open) toggleKbdHelp(false);
      else if (kbdFocus) setKbdFocus(null);
      else return;
      return e.preventDefault();
    }
    if (e.key === '?') { toggleKbdHelp(); return e.preventDefault(); }
    if (open) return;  // help panel eats nav keys while it's up
    const act = { j: () => moveHunk(1), k: () => moveHunk(-1), m: markCurrent,
                  ' ': toggleCollapse,
                  '[': () => moveFile(-1), ']': () => moveFile(1),
                  '{': () => moveSection(-1), '}': () => moveSection(1) }[e.key];
    if (act) { act(); e.preventDefault(); }
  });
}

build();
loadDiagrams();
initKeyboard();
</script>
</body>
</html>
