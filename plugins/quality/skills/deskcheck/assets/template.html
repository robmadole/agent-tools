  :root {
    --bg:#f6f8fa; --panel:#fff; --border:#d1d9e0; --text:#1f2328; --muted:#59636e;
    --add-bg:#e6ffec; --add-ln:#ccffd8; --del-bg:#ffebe9; --del-ln:#ffd7d5;
    --accent:#0969da; --done:#1a7f37; --done-bg:#dafbe1;
    --done-soft:rgba(26,127,55,.35);
  }
  * { box-sizing:border-box; }
  button, textarea { font-family:inherit; }
  body { margin:0; font:14px/1.45 'Cousine',ui-monospace,SFMono-Regular,Menlo,monospace;
         color:var(--text); background:var(--bg);
         display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  code, .code, .hunk-header, .file-path {
    font-family:'Cousine',ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }

  /* ---- top bar ---- */
  #topbar { flex:none; display:flex; align-items:stretch; justify-content:space-between;
            gap:20px; padding:0 20px; background:var(--panel);
            border-bottom:1px solid var(--border); }
  #topbar .tb-left { min-width:0; display:flex; flex-direction:column;
                     justify-content:center; padding:10px 0; }
  #topbar .tb-right { display:flex; align-items:stretch; gap:20px; flex:none; }
  #topbar h1 { font-size:18px; margin:0; overflow-wrap:anywhere; }
  #topbar .sub { color:var(--muted); font-size:12px; margin-top:2px; overflow-wrap:anywhere; }
  #overall { display:flex; align-items:center; color:var(--muted); font-size:12px;
             white-space:nowrap; }

  /* ---- left nav ---- */
  #main-row { flex:1; display:flex; min-height:0; }
  #nav { width:420px; flex:none; overflow-y:auto; background:var(--panel);
         border-right:1px solid var(--border); padding:16px; }
  /* "In Review" -> checkmark: label collapses and the check expands, so the
     whole cell animates its width. Structure is built once (see applyState) so
     the transition survives state updates. */
  #fully-reviewed { display:flex; align-items:center; white-space:nowrap;
                    padding-left:20px; border-left:1px solid var(--border);
                    font-weight:600; font-size:13px; color:#9a6700;
                    overflow:hidden; transition:color .35s ease; }
  #fully-reviewed.on { color:var(--done); }
  #fully-reviewed .fr-label { overflow:hidden; max-width:80px;
                    transition:max-width .35s ease, opacity .2s ease; }
  #fully-reviewed.on .fr-label { max-width:0; opacity:0; }
  #fully-reviewed .fr-check { display:flex; align-items:center; width:0; overflow:hidden;
                    transition:width .35s ease; }
  #fully-reviewed.on .fr-check { width:28px; }
  #fully-reviewed .fr-check svg { width:28px; height:28px; flex:none; }
  #topbar .pr-link { display:flex; align-items:center; gap:6px; padding-left:20px;
                     border-left:1px solid var(--border); font-weight:600; }
  .pr-link { font-size:12px; color:var(--accent); text-decoration:none;
             white-space:nowrap; }
  button.refresh { border:1px solid var(--border); background:var(--panel);
                   border-radius:6px; padding:3px 8px; font-size:11px;
                   cursor:pointer; color:var(--muted); white-space:nowrap; }
  button.refresh:hover { border-color:var(--accent); color:var(--accent); }
  button.refresh:disabled { opacity:.6; cursor:default; }
  button.refresh.busy svg { animation:spin 1s linear infinite; }
  /* in a section header it becomes a full-height, icon-only divider cell */
  .sec-head > button.refresh { align-self:stretch; flex:none; width:48px;
                               margin:-12px -16px -12px 0;
                               display:flex; align-items:center; justify-content:center;
                               padding:0; border:none; border-radius:0;
                               border-left:1px solid color-mix(in srgb, var(--text) 14%, transparent);
                               background:none;
                               color:var(--muted); }
  .sec-head > button.refresh:hover { color:var(--accent);
                               border-left-color:color-mix(in srgb, var(--text) 14%, transparent); }
  @keyframes spin { to { transform:rotate(360deg); } }
  button.new-comments { display:block; width:100%; margin:0 0 10px; padding:6px 10px;
                        border:1px solid var(--accent); background:#ddf4ff;
                        color:var(--accent); border-radius:6px; font-size:12px;
                        cursor:pointer; }
  .diff .comment-row td { padding:0; }
  .nav-item { display:block; padding:8px 10px; border-radius:6px; cursor:pointer;
              margin-bottom:4px; }
  .nav-item:hover { background:var(--bg); }
  .nav-item .t { font-weight:600; font-size:13px; }
  .nav-item.done .t { color:var(--done); }
  svg.fa-icon { width:16px; height:16px; fill:currentColor; vertical-align:-3px; }
  svg.fa-check { margin-left:4px; }
  .nav-item .nav-title-row svg.fa-check { display:none; flex:none; margin:0;
                                          width:14px; height:14px; align-self:center; }
  .nav-item.done .nav-title-row svg.fa-check { display:block; color:var(--done); }
  .nav-item .meta { display:flex; justify-content:space-between; color:var(--muted);
                    font-size:12px; margin-top:2px; }
  .nav-title-row { display:flex; align-items:center; gap:4px; }
  .nav-title-row .t { flex:1; min-width:0; }
  .nav-files { display:none; margin-top:6px; border-left:1px solid var(--border);
               padding-left:6px; }
  .nav-item.files-open .nav-files { display:block; }
  .nav-file { display:flex; align-items:center; gap:6px; font-size:11px;
              color:var(--muted); padding:2px 4px; cursor:pointer; border-radius:4px; }
  /* left-side ellipsis keeps the filename (tail) visible; full path in title */
  .nav-file .nf-name { flex:1; min-width:0; white-space:nowrap; overflow:hidden;
                       text-overflow:ellipsis; direction:rtl; text-align:left;
                       font-family:'Cousine',ui-monospace,SFMono-Regular,Menlo,monospace; }
  .nav-file:hover { color:var(--accent); background:var(--bg); }
  .nav-file svg.fa-check { display:none; flex:none; margin:0; width:12px; height:12px;
                           color:var(--done); }
  .nav-file.reviewed svg.fa-check { display:block; }
  .nav-dir { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted);
             padding:2px 4px; white-space:nowrap; overflow:hidden; }
  .nav-dir svg { width:12px; height:12px; flex:none; opacity:.7; }
  .nav-dir span { overflow:hidden; text-overflow:ellipsis; }
  .dots { color:#bf3989; letter-spacing:3px; }
  .bar { height:4px; background:var(--border); border-radius:2px; margin-top:6px;
         overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--done); width:0;
           transition:width .15s; }

  /* ---- content ---- */
  #content { flex:1; min-width:0; overflow-y:auto; padding:0 24px; }
  /* top spacer scrolls away so sticky headers pin flush under the top bar
     (vertical padding on the scroll container would leave a bleed gap) */
  #content::before { content:''; display:block; height:20px; }
  .muted { color:var(--muted); font-size:12px; }
  /* review toggle: a full-height sectioned cell on the right of each header —
     divider + checkmark only, echoing the top-bar "In Review" treatment.
     Negative margins let it span the header's full height past its padding. */
  /* fixed-width cell (height still stretches to span the header, so the left
     divider runs full-height); translucent divider so it reads correctly on
     every header background — white, gray, blue, green, yellow. */
  button.mark { align-self:stretch; flex:none; width:40px; display:flex;
                align-items:center; justify-content:center; padding:0; border:none;
                border-left:1px solid color-mix(in srgb, var(--text) 14%, transparent);
                background:none;
                cursor:pointer; color:var(--muted); opacity:.4; }
  button.mark svg { margin:0; width:18px; height:18px; }
  button.mark:hover { color:var(--accent); opacity:1; }
  button.mark.on { color:var(--done); opacity:1; }
  /* section cell is wider than the 40px file/hunk cells (which must match each
     other since they stack); the section header stands alone above them. */
  .sec-head  > button.mark { width:48px; margin:-12px -16px -12px 0; }
  .file-head > button.mark { margin:-8px -12px -8px 0; }
  .hunk-head > button.mark { margin:-8px -12px -8px 0; }
  button.copy { flex:none; border:none; background:none; padding:2px 4px; cursor:pointer;
                color:var(--muted); }
  button.copy:hover { color:var(--accent); }
  a.gh-file-link { flex:none; padding:2px 4px; color:var(--muted); }
  a.gh-file-link:hover { color:var(--accent); }
  button.copy svg { margin:0; }

  .sec { background:var(--panel); border:1px solid var(--border); border-radius:8px;
         margin-bottom:20px; }
  /* emphasis via outline (not a thicker border) so toggling reviewed can't
     shift layout by a pixel; border stays 1px, just recolored. */
  .sec.reviewed { border-color:var(--done-soft); outline:1px solid var(--done-soft); }
  .sec-head { display:flex; align-items:center; gap:12px; padding:12px 16px;
              cursor:pointer; border-bottom:1px solid var(--border);
              position:sticky; top:0; z-index:3; background:var(--panel);
              border-radius:8px 8px 0 0; }
  .sec.collapsed > .sec-head { border-bottom:none; border-radius:8px; }
  .sec-head h2 { font-size:16px; margin:0; flex:1; min-width:0; }
  .sec.reviewed > .sec-head h2 { color:var(--done); }
  .sec-body { padding:12px 16px; }
  .sec .summary { margin:0 0 12px; color:var(--muted); }
  .collapsed > .sec-body, .collapsed > .file-body, .collapsed > .hunk-body { display:none; }

  .file { border:1px solid var(--border); border-radius:6px; margin-bottom:12px;
          overflow:clip; background:var(--panel); }
  .file.gone { opacity:.55; }
  .file.gone > .file-head { cursor:default; border-bottom:none; }
  .file.reviewed { border-color:var(--done-soft); outline:1px solid var(--done-soft); }
  /* nested headers park below the section header; --sec-h is its measured
     height (set per section at runtime), so a font/padding/title change
     can't desync the offset. Fallback covers the pre-measure first paint. */
  .file-head { display:flex; align-items:center; gap:10px; padding:8px 12px;
               background:var(--bg); cursor:pointer;
               border-bottom:1px solid var(--border);
               position:sticky; top:var(--sec-h,52px); z-index:2; }
  .file.collapsed > .file-head { border-bottom:none; }
  .file-head .file-path { font-weight:600; min-width:0; overflow-wrap:anywhere; }
  .file-head button.copy { margin-right:auto; }
  .file.reviewed > .file-head .file-path { color:var(--done); }

  .hunk { border-top:1px solid var(--border); }
  .hunk:first-child { border-top:none; }
  .hunk.standalone { border:1px solid var(--border); border-radius:6px;
                     margin-bottom:12px; overflow:clip; }
  .hunk.standalone.reviewed { border-color:var(--done-soft); outline:1px solid var(--done-soft); }
  .hunk.standalone > .hunk-head { position:sticky; top:var(--sec-h,52px); z-index:2; }
  .hunk-head { display:flex; align-items:center; gap:10px; padding:8px 12px;
               background:#f1f8ff; cursor:pointer; }
  .hunk.reviewed > .hunk-head { background:var(--done-bg); }
  .hunk-head .hunk-header { color:var(--muted); flex:1; min-width:0;
                            overflow-wrap:anywhere; }
  .hunk-head .file-path { flex:none; }
  .hunk-body { overflow-x:auto; }
  .binary-note, .empty { padding:8px 12px; color:var(--muted); font-size:12px; }
  .stale { flex:none; font-size:11px; color:#9a6700; background:#fff8c5;
           border:1px solid rgba(212,167,44,.4); border-radius:999px; padding:1px 8px;
           text-transform:uppercase; letter-spacing:.04em; }
  .wip { flex:none; font-size:11px; color:#0550ae; background:#ddf4ff;
         border:1px solid rgba(9,105,218,.35); border-radius:999px; padding:1px 8px;
         white-space:nowrap; text-transform:uppercase; letter-spacing:.04em; }
  .reconnect-overlay { position:fixed; inset:0; background:rgba(246,248,250,.7);
                       display:flex; align-items:center; justify-content:center;
                       z-index:99; }
  .reconnect-box { display:flex; align-items:center; gap:10px; background:var(--panel);
                   border:1px solid var(--border); border-radius:8px; padding:14px 22px;
                   font-weight:600; box-shadow:0 4px 24px rgba(31,35,40,.15); }
  .reconnect-box svg { animation:spin 1s linear infinite; }
  .delta-bar { display:flex; align-items:stretch; gap:10px; padding:8px 12px;
               background:#fff8c5; border-bottom:1px solid var(--border);
               font-size:12px; color:#9a6700; }
  .delta-bar > span { display:flex; align-items:center; }
  button.delta-toggle { margin:-8px -12px -8px auto; align-self:stretch; display:flex;
                        align-items:center; gap:6px; padding:0 14px; border:none;
                        border-left:1px solid var(--border); background:none;
                        font-size:11px; cursor:pointer; color:#9a6700;
                        white-space:nowrap; }
  button.delta-toggle svg { width:17px; height:17px; flex:none; }
  button.delta-toggle:hover { color:#5f3f00; }
  .file.delta-mode > .file-body { display:none; }
  .file:not(.delta-mode) > .delta-body { display:none; }
  .collapsed > .delta-body, .collapsed > .delta-bar { display:none; }
  .delta-hunk { border-top:1px solid var(--border); }
  .delta-hunk:first-child { border-top:none; }
  .delta-hunk .hunk-body { overflow-x:auto; }
  button.files-toggle { flex:none; border:1px solid var(--border); background:var(--panel);
                        border-radius:999px; padding:2px 10px; cursor:pointer;
                        font-size:12px; color:var(--muted);
                        min-width:6.5em; text-align:center;
                        font-variant-numeric:tabular-nums;
                        text-transform:uppercase; letter-spacing:.04em; }
  button.files-toggle:hover { border-color:var(--accent); color:var(--accent); }
  .sec.show-files button.files-toggle { background:#ddf4ff; border-color:var(--accent);
                                        color:var(--accent); }
  .file-list { display:none; margin:0 0 12px; border:1px solid var(--border);
               border-radius:6px; overflow:hidden; }
  .sec.show-files .file-list { display:block; }
  .file-list-item { display:block; padding:4px 12px; cursor:pointer;
                    border-top:1px solid var(--border); }
  .file-list-item:first-child { border-top:none; }
  .file-list-item:hover { background:var(--bg); }
  .file-list-item:hover code { color:var(--accent); }
  .file-list-item code { font-size:12px; overflow-wrap:anywhere; }
  .file-list-item .muted { margin-left:8px; }
  .sec.conv { border-color:rgba(9,105,218,.35); outline:1px solid rgba(9,105,218,.35); }
  .comment { display:flex; gap:10px; align-items:flex-start; padding:14px 16px;
             font-size:13px; background:var(--panel); }
  .comment-avatar { flex:0 0 auto; width:30px; height:30px; border-radius:50%;
                    position:relative; overflow:hidden; display:flex;
                    align-items:center; justify-content:center; color:#fff;
                    font-size:12px; font-weight:600; line-height:1; user-select:none; }
  .comment-avatar.sm { width:24px; height:24px; font-size:11px; }
  .comment-avatar img { position:absolute; inset:0; width:100%; height:100%;
                        object-fit:cover; }
  .comment-main { flex:1 1 auto; min-width:0; }
  .comment-head { display:flex; gap:7px; align-items:center; margin-bottom:4px; }
  .comment-author { font-weight:600; }
  .comment-meta { font-size:12px; }
  .comment-tools { margin-left:auto; display:flex; gap:2px; align-items:center; }
  .comment-tool { display:inline-flex; align-items:center; justify-content:center;
                  width:24px; height:24px; padding:0; border:none; border-radius:5px;
                  background:none; cursor:pointer; color:var(--muted); opacity:.4;
                  text-decoration:none; }
  .comment:hover .comment-tool:not(:disabled),
  .comment:focus-within .comment-tool:not(:disabled) { opacity:.65; }
  .comment-tool:not(:disabled):hover { opacity:1; color:var(--accent); background:var(--bg); }
  .comment-tool:disabled { cursor:default; opacity:.22; }
  .comment-tool svg.fa-icon { width:15px; height:15px; vertical-align:0; }
  .comment-tool.act-delete.danger { opacity:1; color:#cf222e;
    background:color-mix(in srgb, #cf222e 14%, transparent); }
  svg.fa-new-file { margin-right:2px; }
  .comment-body { overflow-wrap:anywhere; }
  .comment-body > *:first-child { margin-top:0; }
  .comment-body > *:last-child { margin-bottom:0; }
  .comment-body p, .comment-body ul, .comment-body ol, .comment-body pre,
  .comment-body blockquote, .comment-body table { margin:0 0 8px; }
  .comment-body ul, .comment-body ol { padding-left:22px; }
  .comment-body code { background:var(--bg); padding:1px 4px; border-radius:4px; }
  .comment-body pre { background:var(--bg); padding:8px 10px; border-radius:6px;
                      overflow-x:auto; }
  .comment-body pre code { background:none; padding:0; }
  .comment-body blockquote { border-left:3px solid var(--border);
                             padding-left:10px; color:var(--muted); }
  .comment-body img { max-width:100%; }
  .comment-body a { color:var(--accent); }
  /* conversation comments stand alone (flat list, not a thread card) */
  .sec-body > .comment, .file-body > .comment {
    border:1px solid var(--border); border-radius:6px; margin:0 0 8px; }

  /* inline threads: a card grouping root + replies + a reply field */
  .thread { border:1px solid var(--border); border-radius:8px; overflow:clip;
            background:var(--panel); margin:0 8px; }
  /* replies nest under a thread line dropped from the root avatar's center */
  .thread-replies { margin-left:31px; border-left:2px solid var(--border); }
  .thread-replies:empty { display:none; }
  .thread-replies .comment.reply { padding:11px 14px; }
  .thread-replies .comment.reply + .comment.reply {
    border-top:1px solid color-mix(in srgb, var(--text) 8%, transparent); }
  /* the reply field at the foot of a thread */
  .thread-reply { display:flex; padding:10px 16px; background:var(--bg);
                  border-top:1px solid var(--border); }
  .thread-reply-collapsed { display:flex; gap:9px; align-items:center;
                            flex:1 1 auto; cursor:text; }
  .thread-reply-pill { flex:1 1 auto; padding:7px 11px; font-size:13px;
                       color:var(--muted); background:var(--panel);
                       border:1px solid var(--border); border-radius:6px; }
  .thread-reply-collapsed:hover .thread-reply-pill { border-color:var(--muted); }
  .thread-reply > .compose { flex:1 1 auto; padding:0; background:none; }

  /* ---- compose / reply ---- */
  body.can-comment .diff td.ln { cursor:pointer; }
  /* hover "+" affordance is a top-layer popover, positioned in JS */
  /* NB: don't set display here — a closed popover relies on the UA display:none,
     and overriding it leaves a stuck "ghost" button. Set display only when open. */
  .ln-add { position:fixed; margin:0; inset:auto; transform:translate(-50%,-50%);
            width:28px; height:28px; padding:0; border:none; border-radius:7px;
            cursor:pointer; background:var(--accent); color:#fff; line-height:1;
            box-shadow:0 1px 4px rgba(31,35,40,.4); }
  .ln-add:popover-open { display:flex; align-items:center; justify-content:center; }
  .ln-add:hover { background:#0a5cc7; }

  /* ---- expandable context between hunks ---- */
  .context-lines table.diff { width:100%; }
  .context-bar { display:flex; align-items:center; justify-content:center; gap:7px;
                 padding:7px 8px; cursor:pointer; font-size:11px; color:var(--muted);
                 border-top:1px solid var(--border); border-bottom:1px solid var(--border);
                 user-select:none; }
  /* a gap at the file's edge drops the border that would double the container's */
  .context-gap:first-child .context-bar { border-top:none; }
  .context-gap:last-child .context-bar { border-bottom:none; }
  /* the bar's bottom border (or, once expanded, its continuous lines) is the
     seam to the next hunk — drop that hunk's top border so it isn't doubled */
  .context-gap + .hunk { border-top:none; }
  .context-bar:hover { color:var(--accent); }
  .context-icon { display:inline-flex; }
  .context-icon svg.fa-icon { width:15px; height:15px; vertical-align:0; }
  .ln-add svg.fa-icon { width:20px; height:20px; vertical-align:0; }
  .compose { padding:8px 12px; background:var(--panel); }
  .compose textarea { width:100%; box-sizing:border-box; min-height:68px; resize:vertical;
                      font:inherit; font-size:13px; padding:8px; color:var(--text);
                      border:1px solid var(--border); border-radius:6px; background:var(--bg); }
  .compose-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
  .compose-actions button { border-radius:6px; padding:5px 14px; font-size:12px;
                            cursor:pointer; border:1px solid var(--border); }
  .compose-submit { background:var(--accent); border-color:var(--accent); color:#fff; }
  .compose-submit:disabled { opacity:.6; cursor:default; }
  .compose-cancel { background:var(--panel); color:var(--text); }
  .compose-hint { color:var(--muted); font-size:11px; margin-right:auto; align-self:center; }
  .compose-error { color:#cf222e; font-size:12px; margin-top:6px; overflow-wrap:anywhere; }
  .comment-edit { margin-top:6px; }

  /* ---- diff table ---- */
  table.diff { border-collapse:collapse; width:100%; }
  .diff td { padding:0 8px; vertical-align:top; }
  .diff td.ln { width:1%; min-width:40px; text-align:right; color:var(--muted);
                user-select:none; }
  .diff td.sign { width:1%; user-select:none; color:var(--muted); padding:0 4px; }
  .diff td.code { white-space:pre; width:100%; }
  .diff tr.add { background:var(--add-bg); }
  .diff tr.add td.ln { background:var(--add-ln); }
  .diff tr.del { background:var(--del-bg); }
  .diff tr.del td.ln { background:var(--del-ln); }
  .diff tr.meta td.code { color:var(--muted); }
  .diff tr.add .emph { background:#abf2bc; border-radius:2px; }
  .diff tr.del .emph { background:#ffc1bc; border-radius:2px; }

  /* ---- pygments tokens (GitHub-ish light) ---- */
  .code .k,.code .kd,.code .kn,.code .kp,.code .kr,.code .kt,.code .ow { color:#cf222e; }
  .code .s,.code .s1,.code .s2,.code .sb,.code .sd,.code .se,.code .sh,.code .si,
  .code .sx,.code .sr,.code .ss { color:#0a3069; }
  .code .c,.code .c1,.code .cm,.code .cp,.code .cs { color:#59636e; font-style:italic; }
  .code .na,.code .nc,.code .nd,.code .nf,.code .nn,.code .ne { color:#6639ba; }
  .code .nb,.code .bp,.code .nv,.code .vi,.code .vc,.code .vg { color:#953800; }
  .code .nt { color:#116329; }
  .code .mi,.code .mf,.code .mh,.code .mo,.code .mb,.code .il { color:#0550ae; }
  .code .gd { color:#82071e; } .code .gi { color:#116329; }
</style>
</head>

  <div class="tb-left">
    <h1 id="title"></h1>
    <div class="sub" id="sub"></div>

    <div id="overall"></div>

  </div>
</header>
<div id="main-row">
  <aside id="nav">
    <div id="sections-nav"></div>

  <main id="content"></main>
</div>

const $ = (s, r) => (r || document).querySelector(s);

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

// Group inline comments into GitHub-style threads: a root (no in_reply_to_id)
// plus its replies. Each reply resolves to its thread's root by walking
// in_reply_to_id — GitHub flattens threads to one level, but chained ids
// resolve fine too. threadsByFile[path] holds each thread once, anchored by its
// root's line.
const commentsById = {};
((DATA.comments || {}).inline || []).forEach(c => { commentsById[c.id] = c; });
function threadRoot(c) {
  let cur = c, guard = 0;
  while (cur.in_reply_to_id && commentsById[cur.in_reply_to_id] && guard++ < 200)
    cur = commentsById[cur.in_reply_to_id];
  return cur;
}
const threadsByFile = {};
const threadsByRoot = new Map();
((DATA.comments || {}).inline || []).forEach(c => {
  const root = threadRoot(c);
  let t = threadsByRoot.get(root.id);
  if (!t) {
    t = { root, replies: [] };
    threadsByRoot.set(root.id, t);
    (threadsByFile[root.path] ||= []).push(t);
  }
  if (c !== root) t.replies.push(c);      // chronological (inline[] is by created_at)
});

// Composing is only possible when the branch has a PR to post against.
const canComment = !!(DATA.comments && DATA.comments.url);

// A full-width row that hangs extra content (a comment, a composer) under a
// diff line — the shape the GitHub-style comment anchoring already uses.
function commentRow(node) {
  const tr = document.createElement('tr');
  tr.className = 'comment-row';
  const td = document.createElement('td');
  td.colSpan = 4;
  td.append(node);
  tr.append(td);
  return tr;
}

// Insert `tr` after `anchorRow` AND after any comment/composer rows already
// hanging off it, so multiple comments on one line stay in the order added
// (chronological) instead of each new one landing on top of the row.
function insertAfterAnchor(anchorRow, tr) {
  let at = anchorRow;
  while (at.nextElementSibling &&
         (at.nextElementSibling.classList.contains('comment-row') ||
          at.nextElementSibling.classList.contains('composer-row'))) {
    at = at.nextElementSibling;
  }
  at.after(tr);
}

function hunkRange(header) {
  const m = /^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))?/.exec(header || '');
  return m ? { o: +m[1], ol: +(m[2] ?? 1), n: +m[3], nl: +(m[4] ?? 1) } : null;
}

function commentInHunk(c, h) {
  const r = hunkRange(h.header);
  if (!r || c.line == null) return false;
  return c.side === 'LEFT' ? c.line >= r.o && c.line < r.o + r.ol
                           : c.line >= r.n && c.line < r.n + r.nl;
}

// Deterministic fallback color for an avatar when no image is available.
function avatarColor(name) {
  let h = 0;
  for (const ch of (name || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return `hsl(${h % 360} 52% 46%)`;
}

// A round avatar: a colored initial with the real GitHub image layered over it,
// so an offline / 404 avatar degrades to the initial instead of a broken image.
function avatarEl(author, url, sm) {
  const av = el('div', 'comment-avatar' + (sm ? ' sm' : ''));
  av.style.background = avatarColor(author);
  av.append(el('span', 'comment-avatar-initial', (author || '?').slice(0, 1).toUpperCase()));
  if (url) {
    const img = el('img');
    img.src = url; img.alt = author; img.loading = 'lazy';
    img.onerror = () => img.remove();
    av.append(img);
  }
  return av;
}

// One comment: an avatar gutter + a main column (author/meta/tools header, then
// body). Edit/Delete/GitHub are quiet tools top-right; Reply is the thread's
// foot field (see threadBlock), so a card carries no bottom action strip.
function commentCard(c, note) {
  const d = el('div', 'comment');
  const main = el('div', 'comment-main');
  const head = el('div', 'comment-head');
  head.append(el('strong', 'comment-author', c.author));
  head.append(el('span', 'muted comment-meta',
    'commented ' + (c.created_at || '').slice(0, 10) + (note ? ' · ' + note : '')));
  const tools = el('div', 'comment-tools');
  const gh = el('a', 'comment-tool');
  gh.href = c.url; gh.target = '_blank'; gh.title = 'Open on GitHub';
  gh.innerHTML = FA_UP_RIGHT;
  tools.append(gh);
  // Edit/Delete render on every inline comment (id present) but are disabled
  // unless you authored it — GitHub only lets an author mutate their own, so
  // the buttons stay for a consistent tool cluster while making that clear.
  const viewer = (DATA.comments || {}).viewer;
  if (canComment && c.id) {
    const mine = viewer && c.author === viewer;
    const edit = el('button', 'comment-tool');
    edit.type = 'button'; edit.innerHTML = FA_PEN; edit.disabled = !mine;
    edit.title = mine ? 'Edit' : 'Only the author can edit';
    if (mine) edit.onclick = () => editComment(d, c);
    tools.append(edit);
    const del = el('button', 'comment-tool act-delete');
    del.type = 'button'; del.innerHTML = FA_TRASH; del.disabled = !mine;
    del.title = mine ? 'Delete' : 'Only the author can delete';
    if (mine) del.onclick = () => deleteComment(d, c, del);
    tools.append(del);
  }
  head.append(tools);
  const body = el('div', 'comment-body');
  if (c.body_html) body.innerHTML = c.body_html;
  else { body.textContent = c.body; body.style.whiteSpace = 'pre-wrap'; }
  main.append(head, body);
  d.append(avatarEl(c.author, c.avatar_url), main);
  return d;
}

// Shared compose widget: a textarea + Cancel/Comment, Cmd/Ctrl+Enter to submit,
// Esc to cancel. onSubmit(body) may throw to surface an inline error.
function composeBox({ placeholder, submitLabel, value, onSubmit, onCancel }) {
  const box = el('div', 'compose');
  const ta = el('textarea');
  ta.placeholder = placeholder || 'Leave a comment';
  if (value) ta.value = value;
  const bar = el('div', 'compose-actions');
  bar.append(el('span', 'compose-hint', '⌘/Ctrl+Enter'));
  const cancel = el('button', 'compose-cancel', 'Cancel');
  const submit = el('button', 'compose-submit', submitLabel || 'Comment');
  cancel.onclick = () => onCancel();
  const send = async () => {
    const val = ta.value.trim();
    if (!val) return;
    submit.disabled = true;
    const label = submit.textContent;
    submit.textContent = 'Posting…';
    box.querySelector('.compose-error')?.remove();
    try {
      await onSubmit(val);
    } catch (e) {
      submit.disabled = false;
      submit.textContent = label;
      box.append(el('div', 'compose-error', String(e.message || e)));
    }
  };
  submit.onclick = send;
  ta.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); send(); }
    else if (e.key === 'Escape') { e.preventDefault(); onCancel(); }
  });
  bar.append(cancel, submit);
  box.append(ta, bar);
  setTimeout(() => {
    ta.focus();
    if (value) ta.setSelectionRange(value.length, value.length);  // cursor at end
  }, 0);
  return box;
}

async function postComment(payload) {
  const res = await api('/api/add-comment', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });
  const j = await res.json();
  if (!j.ok) throw new Error(j.detail || 'failed to post comment');
  return j.comment;  // server also refreshes comments.json in the background
}

// Inline-edit a comment: swap its body for a composer prefilled with the source.
function editComment(card, c) {
  if (card.querySelector('.comment-edit')) return;   // already editing
  const bodyEl = card.querySelector('.comment-body');
  const tools = card.querySelector('.comment-tools');
  bodyEl.style.display = 'none';
  if (tools) tools.style.display = 'none';
  const restore = () => {
    edit.remove(); bodyEl.style.display = '';
    if (tools) tools.style.display = '';
  };
  const box = composeBox({
    value: c.body, submitLabel: 'Save', onCancel: restore,
    onSubmit: async val => {
      const res = await api('/api/edit-comment', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: c.id, body: val }),
      });
      const j = await res.json();
      if (!j.ok) throw new Error(j.detail || 'edit failed');
      c.body = j.comment.body; c.body_html = j.comment.body_html;
      if (c.body_html) bodyEl.innerHTML = c.body_html;
      else { bodyEl.textContent = c.body; bodyEl.style.whiteSpace = 'pre-wrap'; }
      restore();
    },
  });
  const edit = el('div', 'comment-edit');
  edit.append(box);
  bodyEl.after(edit);
}

// Delete a comment — two-click inline confirm (no native dialog): the first
// click arms the trash button (fills it red), a second within 3s deletes.
function deleteComment(card, c, btn) {
  const disarm = () => {
    btn.dataset.armed = ''; btn.classList.remove('danger'); btn.title = 'Delete';
  };
  if (btn.dataset.armed !== '1') {
    btn.dataset.armed = '1';
    btn.classList.add('danger');
    btn.title = 'Click again to delete';
    btn._t = setTimeout(disarm, 3000);
    return;
  }
  clearTimeout(btn._t);
  api('/api/delete-comment', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: c.id }),
  }).then(r => r.json()).then(j => {
    if (j.ok) { (card.closest('.comment-row') || card).remove(); return; }
    disarm();
    card.querySelector('.comment-main').append(
      el('span', 'compose-error', j.detail || 'delete failed'));
  });
}

// Open a composer under a diff line. side/line come from the clicked td.ln.
function addLineComposer(row, file, line, side) {
  // if a composer is already open in this line's comment block, focus it
  for (let s = row.nextElementSibling;
       s && (s.classList.contains('comment-row') || s.classList.contains('composer-row'));
       s = s.nextElementSibling) {
    if (s.classList.contains('composer-row')) { s.querySelector('textarea').focus(); return; }
  }
  const box = composeBox({
    placeholder: `Comment on ${file}:${line}`,
    onCancel: () => tr.remove(),
    onSubmit: async val => {
      // wrap the new comment as a one-comment thread so it gets its reply foot
      const c = await postComment({ path: file, line, side, body: val });
      tr.replaceWith(commentRow(threadBlock({ root: c, replies: [] }, 'line ' + line)));
    },
  });
  const tr = commentRow(box);
  tr.classList.add('composer-row');
  insertAfterAnchor(row, tr);
}

// Resolve a numbered line-number cell to its composer target, or null.
// Left cell → old side (LEFT), right cell → new side (RIGHT). Delta-view hunk
// bodies have no hunkFile, so they never yield a target.
function lineTargetFromCell(cell) {
  const body = cell && cell.closest('.hunk-body');
  if (!body || !body.dataset.hunkFile) return null;
  const num = cell.textContent.trim();
  if (!/^\d+$/.test(num)) return null;
  const row = cell.closest('tr');
  const side = [...row.querySelectorAll('td.ln')].indexOf(cell) === 0 ? 'LEFT' : 'RIGHT';
  return { row, file: body.dataset.hunkFile, line: +num, side };
}

// A top-layer Popover API button that follows the pointer. `resolve(el)` maps
// the element under the pointer to { rect, data } (or null): over that target →
// show the button centered on rect and remember data; over the button → stay;
// anywhere else → hide. The pointer's real position is the single source of
// truth, which is what makes hide-on-leave robust — and a closed popover MUST
// be truly display:none (see the :popover-open CSS) or it strands a ghost.
function hoverPopover({ cls, html, title, resolve, onClick }) {
  const btn = el('button', cls);
  btn.type = 'button';
  btn.innerHTML = html;
  if (title) btn.title = title;
  btn.setAttribute('popover', 'manual');
  document.body.append(btn);
  let data = null;
  const hide = () => {
    data = null;
    if (btn.matches(':popover-open')) { try { btn.hidePopover(); } catch (e) {} }
  };
  const showAt = (rect, d) => {
    data = d;
    btn.style.left = (rect.left + rect.width / 2) + 'px';
    btn.style.top = (rect.top + rect.height / 2) + 'px';
    if (!btn.matches(':popover-open')) { try { btn.showPopover(); } catch (e) {} }
  };
  const evaluate = (x, y) => {
    const at = document.elementFromPoint(x, y);
    if (!at) { hide(); return; }
    if (at === btn || btn.contains(at)) return;
    const hit = at.closest ? resolve(at) : null;
    if (hit) showAt(hit.rect, hit.data); else hide();
  };
  document.addEventListener('pointermove', e => evaluate(e.clientX, e.clientY));
  // no pointermove fires once the pointer leaves the window — catch those
  document.documentElement.addEventListener('pointerleave', hide);
  document.addEventListener('mouseout', e => { if (!e.relatedTarget) hide(); });
  btn.addEventListener('click', () => {
    if (data == null) return;
    const d = data;
    hide();
    onClick(d);
  });
  // a scroll would leave the fixed button stranded over the wrong row
  window.addEventListener('scroll', hide, true);
}

if (canComment) {
  document.addEventListener('click', e => {
    const t = e.target.closest && lineTargetFromCell(e.target.closest('td.ln'));
    if (t) addLineComposer(t.row, t.file, t.line, t.side);
  });
  hoverPopover({
    cls: 'ln-add', html: FA_COMMENT_PLUS, title: 'Add a comment on this line',
    resolve: at => {
      const cell = at.closest('.hunk-body td.ln');
      const t = cell && lineTargetFromCell(cell);
      return t ? { rect: cell.getBoundingClientRect(), data: t } : null;
    },
    onClick: t => addLineComposer(t.row, t.file, t.line, t.side),
  });
}

let reconnecting = false;
function showReconnect() {
  if (DATA.preview) return;  // static preview render: no server to reconnect to
  if (reconnecting) return;
  reconnecting = true;
  const ov = el('div', 'reconnect-overlay');
  const box = el('div', 'reconnect-box');
  box.innerHTML = FA_REFRESH + ' Reconnecting…';
  ov.append(box);
  document.body.append(ov);
  const probe = async () => {
    try {
      const r = await fetch('/api/state', { cache: 'no-store' });
      if (r.ok) { location.reload(); return; }
    } catch (e) { /* still down */ }
    setTimeout(probe, 2000);
  };
  setTimeout(probe, 1000);
}

// all XHR goes through this: a connection failure flips the page into
// reconnect mode instead of silently doing nothing
async function api(url, opts) {
  try {
    return await fetch(url, opts);
  } catch (e) {
    showReconnect();
    throw e;
  }
}

function wipBadge(path) {
  const wip = (DATA.files[path] || {}).wip;
  if (!wip) return null;
  const s = el('span', 'wip', wip);
  s.title = 'This file has uncommitted changes — what you review may still move';
  return s;
}

const hunkKey = (file, h) => 'hunk:' + file + ':' + h.id;
const fileKey = f => 'file:' + f + ':' + ((DATA.files[f] || {}).hash || '');
const fileHunks = f => (DATA.files[f] || {}).hunks || [];
const findHunk = e => fileHunks(e.file).find(x => x.index === e.index);
// A file counts as reviewed when every one of its hunks is covered.
const fileReviewed = path => {
  const hunks = fileHunks(path);
  return hunks.length > 0 &&
    hunks.every(h => state[hunkKey(path, h)] || state[fileKey(path)]);
};

// A hunk counts as covered when it or its whole file is marked reviewed —
// progress display only; marking a file never writes hunk marks.
function coverEntries(sec) {
  const out = [];
  const add = (f, h) => out.push({
    key: hunkKey(f, h),
    covered: !!(state[hunkKey(f, h)] || state[fileKey(f)])
  });
  (sec.files || []).forEach(f => fileHunks(f).forEach(h => add(f, h)));
  (sec.extra_hunks || []).forEach(e => {
    const h = findHunk(e);
    if (h) add(e.file, h);
  });
  return out;
}

function dots(d) {
  const v = Math.max(1, Math.min(5, d || 1));
  return '●'.repeat(v) + '○'.repeat(5 - v);
}

async function toggle(key) {
  const res = await api('/api/toggle', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ key })
  });
  const j = await res.json();
  state[j.key] = j.reviewed;
  document.querySelectorAll('[data-key]').forEach(n => {
    if (n.dataset.key === j.key) n.classList.toggle('collapsed', j.reviewed);
  });
  applyState();
}

// After a file collapses, keep its header in view so the page doesn't land in
// an arbitrary spot from the layout shift. block:'nearest' scrolls the
// minimum needed — zero when the header is already visible.
function scrollToCollapsed(btn, key) {
  if (!key.startsWith('file:') || !state[key]) return;
  const node = btn.closest('[data-key]');
  if (node) node.scrollIntoView({ block: 'nearest' });
}

function markBtn(key) {
  const b = el('button', 'mark');
  b.dataset.markFor = key;
  const level = key.split(':')[0];
  b.innerHTML = FA_CHECK;
  b.title = 'Mark ' + level + ' reviewed';
  b.onclick = async ev => {
    ev.stopPropagation();
    await toggle(key);
    scrollToCollapsed(b, key);
  };
  return b;
}

function collapsible(container, headerEl) {
  headerEl.onclick = () => container.classList.toggle('collapsed');
}

function ghFileLink(path) {
  if (!DATA.comments || !DATA.comments.url) return null;
  const a = el('a', 'gh-file-link');
  a.innerHTML = FA_UP_RIGHT;
  a.title = 'View on GitHub';
  a.target = '_blank';
  a.href = DATA.comments.url + '/files';
  crypto.subtle.digest('SHA-256', new TextEncoder().encode(path)).then(buf => {
    const hex = [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
    a.href = DATA.comments.url + '/files#diff-' + hex;
  });
  a.onclick = ev => ev.stopPropagation();
  return a;
}

function copyBtn(path) {
  const b = el('button', 'copy');
  b.title = 'Copy file path';
  b.innerHTML = FA_COPY;
  b.onclick = ev => {
    ev.stopPropagation();
    const done = () => {
      b.innerHTML = FA_CHECK;
      setTimeout(() => { b.innerHTML = FA_COPY; }, 1000);
    };
    navigator.clipboard.writeText(path).then(done, () => {
      const t = document.createElement('textarea');
      t.value = path;
      document.body.append(t);
      t.select();
      document.execCommand('copy');
      t.remove();
      done();
    });
  };
  return b;
}

const fileLoads = new Map();
function ensureFile(path) {
  if (!fileLoads.has(path)) {
    fileLoads.set(path, api('/api/filediff?path=' + encodeURIComponent(path))
      .then(r => r.json())
      .then(d => {
        document.querySelectorAll('.hunk-body').forEach(b => {
          if (b.dataset.hunkFile !== path) return;
          const h = d.hunks.find(x => x.id === b.dataset.hunkId);
          if (h) {
            b.innerHTML = h.html;
            b.style.minHeight = '';
            injectComments(b, path, h);
          }
        });
        addTrailingGap(path, d.total_new);
      })
      .catch(() => fileLoads.delete(path)));
  }
  return fileLoads.get(path);
}

const io = new IntersectionObserver(entries => entries.forEach(en => {
  if (en.isIntersecting) {
    io.unobserve(en.target);
    ensureFile(en.target.dataset.hunkFile);
  }
}), { rootMargin: '800px 0px' });

function hunkBlock(file, h, standalone, noMark) {
  const key = hunkKey(file, h);
  const div = el('div', standalone ? 'hunk standalone' : 'hunk');
  div.dataset.key = key;
  if (h.binary) {
    // no hunk chrome for binaries — just the declined-to-render note
    const body = el('div', 'hunk-body');
    body.dataset.hunkFile = file;
    body.dataset.hunkId = h.id;
    body.innerHTML = '<div class="empty">Loading…</div>';
    io.observe(body);
    div.append(body);
    return div;
  }
  const head = el('div', 'hunk-head');
  if (standalone) {
    head.append(el('code', 'file-path', file));
    const wb = wipBadge(file);
    if (wb) head.append(wb);
    const gl = ghFileLink(file);
    if (gl) head.append(gl);
    head.append(copyBtn(file));
  }
  head.append(el('code', 'hunk-header', h.header));
  if (!noMark) head.append(markBtn(key));
  const body = el('div', 'hunk-body');
  body.dataset.hunkFile = file;
  body.dataset.hunkId = h.id;
  // Size the placeholder from the hunk's new-side line count so jumps and the
  // scrollbar are computed against near-real heights before content loads.
  const m = /\+\d+(?:,(\d+))?/.exec(h.header);
  body.style.minHeight = ((m ? +(m[1] || 1) : 8) * 18 + 10) + 'px';
  body.innerHTML = '<div class="empty">Loading diff…</div>';
  io.observe(body);
  div.append(head, body);
  collapsible(div, head);
  return div;
}

// GitHub-style anchoring: splice each comment into the diff table directly
// under the row for its line (new-side for RIGHT, old-side for LEFT).
// Render a thread as its root comment card plus indented reply cards.
function threadBlock(thread, rootNote) {
  const wrap = el('div', 'thread');
  wrap.append(commentCard(thread.root, rootNote));
  const replies = el('div', 'thread-replies');   // left thread-line; hidden while empty
  thread.replies.forEach(r => {
    const card = commentCard(r);
    card.classList.add('reply');
    replies.append(card);
  });
  wrap.append(replies);
  if (canComment && thread.root.id) wrap.append(replyFoot(thread.root, replies));
  return wrap;
}

// The thread's reply affordance: a collapsed "Reply…" pill that expands into a
// composer. A posted reply appends to the thread's reply column (root threads
// are flat), then the field collapses back.
function replyFoot(root, replies) {
  const foot = el('div', 'thread-reply');
  const collapsed = el('div', 'thread-reply-collapsed');
  const cm = DATA.comments || {};
  collapsed.append(avatarEl(cm.viewer || '', cm.viewer_avatar, true));
  collapsed.append(el('div', 'thread-reply-pill', 'Reply…'));
  foot.append(collapsed);
  collapsed.onclick = () => {
    if (foot.querySelector('.compose')) return;   // already expanded
    collapsed.style.display = 'none';
    const box = composeBox({
      placeholder: 'Reply…', submitLabel: 'Reply',
      onCancel: () => { box.remove(); collapsed.style.display = ''; },
      onSubmit: async val => {
        const reply = commentCard(await postComment({ in_reply_to: root.id, body: val }));
        reply.classList.add('reply');
        replies.append(reply);
        box.remove(); collapsed.style.display = '';
      },
    });
    foot.append(box);
  };
  return foot;
}

// Splice each thread under its root's line (roots carry the anchor; replies
// ride along inside the thread block).
function injectComments(body, file, h) {
  const ts = (threadsByFile[file] || []).filter(t => commentInHunk(t.root, h));
  if (!ts.length) return;
  const rows = [...body.querySelectorAll('table.diff tr')];
  ts.forEach(t => {
    const c = t.root;
    const lnIdx = c.side === 'LEFT' ? 0 : 1;
    const row = rows.find(r => {
      const cells = r.querySelectorAll('td.ln');
      return cells[lnIdx] && cells[lnIdx].textContent === String(c.line);
    });
    const tr = commentRow(threadBlock(t, 'line ' + c.line));
    const tbody = body.querySelector('tbody');
    if (row) insertAfterAnchor(row, tr);
    else if (tbody) tbody.append(tr);
  });
}

// A collapsed run of unchanged lines between hunks (or file-start → first
// hunk). The descriptor lives on the .context-bar so the expand popover can act
// on it; revealed rows accumulate in .context-lines above the bar.
const CTX_CHUNK = 20;

function gapLabel(g) {
  const n = g.endNew - g.startNew + 1;
  return n + ' hidden line' + (n === 1 ? '' : 's');
}

function contextGap(path, gap) {
  const wrap = el('div', 'context-gap');
  const lines = el('div', 'context-lines');
  const bar = el('div', 'context-bar');
  bar._gap = { path, ...gap };
  const icon = el('span', 'context-icon');
  icon.innerHTML = FA_EXPAND;                        // the expand affordance, inline
  bar.append(icon, el('span', 'context-label', gapLabel(bar._gap)));
  bar.onclick = () => expandGap(bar);                // whole strip clickable
  wrap.append(lines, bar);
  return wrap;
}

// The trailing gap (last hunk → EOF) needs the file's total line count, which
// only arrives with the hydrated /api/filediff payload — so it's added here,
// once, and only when the last hunk doesn't already reach the end of the file.
function addTrailingGap(path, totalNew) {
  if (!totalNew) return;
  const hunks = fileHunks(path);
  const last = hunks.length && hunkRange(hunks[hunks.length - 1].header);
  if (!last) return;
  const startNew = last.n + last.nl;
  if (startNew > totalNew) return;                 // last hunk already at EOF
  const anyBody = [...document.querySelectorAll('.hunk-body')]
    .find(b => b.dataset.hunkFile === path);
  const fileBody = anyBody && anyBody.closest('.file-body');
  if (!fileBody || fileBody.querySelector('.context-gap.trailing')) return;
  const gap = contextGap(path, { startNew, startOld: last.o + last.ol, endNew: totalNew });
  gap.classList.add('trailing');
  const hunkDivs = fileBody.querySelectorAll(':scope > .hunk');
  const lastHunk = hunkDivs[hunkDivs.length - 1];
  if (lastHunk) lastHunk.after(gap); else fileBody.append(gap);
}

async function expandGap(bar) {
  const g = bar._gap;
  const room = Math.min(CTX_CHUNK, g.endNew - g.startNew + 1);
  if (room <= 0) return;
  let d;
  try {
    d = await (await api('/api/context?path=' + encodeURIComponent(g.path)
      + '&new_start=' + g.startNew + '&old_start=' + g.startOld
      + '&count=' + room)).json();
  } catch (e) { return; }
  const gapEl = bar.closest('.context-gap');
  if (!d.rows) { gapEl.remove(); return; }
  const tbl = el('table', 'diff');
  const tb = document.createElement('tbody');
  tb.innerHTML = d.rows;
  tbl.append(tb);
  gapEl.querySelector('.context-lines').append(tbl);
  const revealed = tb.children.length;
  g.startNew += revealed;
  g.startOld += revealed;
  // fully unfolded → drop only the "⋯" strip, keep the revealed lines in place
  if (g.startNew > g.endNew) bar.remove();
  else bar.querySelector('.context-label').textContent = gapLabel(g);
}

function fileBlock(path) {
  const hunks = fileHunks(path);
  if (!hunks.length) {
    // Sectioned but no longer differing from target — retired, not reviewable.
    const div = el('div', 'file gone');
    const head = el('div', 'file-head');
    head.append(el('code', 'file-path', path), el('span', 'muted', 'no longer in diff'));
    div.append(head);
    return div;
  }
  const key = 'file:' + path + ':' + ((DATA.files[path] || {}).hash || '');
  const div = el('div', 'file');
  div.dataset.key = key;
  const head = el('div', 'file-head');
  head.append(el('code', 'file-path', path));
  const wb = wipBadge(path);
  if (wb) head.append(wb);
  const gl = ghFileLink(path);
  if (gl) head.append(gl);
  head.append(copyBtn(path));
  const staleMark = Object.keys(state).some(k =>
    k.startsWith('file:' + path + ':') && k !== key && state[k]);
  const isStale = staleMark && !state[key];
  if (isStale) head.append(el('span', 'stale', 'changed since review'));
  // A brand-new single-hunk file, or a binary: file and hunk are the same
  // review unit — the file button does both and the hunk button is suppressed.
  const r0 = hunkRange(hunks[0].header);
  const newSingle = hunks.length === 1 && r0 && r0.o === 0 && r0.ol === 0;
  const isBinary = hunks.length === 1 && hunks[0].binary;
  const single = newSingle || isBinary;
  const label = el('span', 'muted');
  if (newSingle) { label.innerHTML = FA_NEW_FILE; label.title = 'new file'; }
  else if (isBinary) label.textContent = 'binary';
  else label.textContent = hunks.length + (hunks.length === 1 ? ' hunk' : ' hunks');
  head.append(label);
  const mb = markBtn(key);
  if (single) {
    const hk = hunkKey(path, hunks[0]);
    mb.onclick = async ev => {
      ev.stopPropagation();
      await toggle(key);
      if (!!state[hk] !== !!state[key]) await toggle(hk);
      scrollToCollapsed(mb, key);
    };
  }
  head.append(mb);
  const body = el('div', 'file-body');
  // Interleave expandable gaps: file-start → first hunk, and between hunks.
  // Both are bounded by the hunk headers (old/new advance together in unchanged
  // regions, so the leading gap starts at old 1 / new 1). The trailing gap
  // (last hunk → EOF) is added later in addTrailingGap(), once hydration reveals
  // the file's total line count.
  hunks.forEach((h, i) => {
    const cur = hunkRange(h.header);
    if (i === 0) {
      if (cur && cur.n > 1)
        body.append(contextGap(path, { startNew: 1, startOld: 1, endNew: cur.n - 1 }));
    } else {
      const prev = hunkRange(hunks[i - 1].header);
      if (cur && prev && cur.n - 1 >= prev.n + prev.nl)
        body.append(contextGap(path, {
          startNew: prev.n + prev.nl, startOld: prev.o + prev.ol, endNew: cur.n - 1 }));
    }
    body.append(hunkBlock(path, h, false, single));
  });
  (threadsByFile[path] || [])
    .filter(t => !hunks.some(h => commentInHunk(t.root, h)))
    .forEach(t => body.append(threadBlock(t,
      t.root.line ? 'line ' + t.root.line + ', outside current diff' : 'file comment')));
  if (isStale) {
    // show only what changed since the reviewer's mark-time snapshot,
    // with a toggle back to the full diff
    const bar = el('div', 'delta-bar');
    bar.append(el('span', '', 'Showing changes since your review'));
    const tog = el('button', 'delta-toggle');
    const setTogLabel = on => tog.innerHTML = FA_DIFF + '<span>'
      + (on ? 'Show full diff' : 'Show changes since review') + '</span>';
    setTogLabel(true);
    tog.onclick = ev => {
      ev.stopPropagation();
      setTogLabel(div.classList.toggle('delta-mode'));
    };
    bar.append(tog);
    const deltaBody = el('div', 'delta-body');
    deltaBody.innerHTML = '<div class="empty">Loading changes since your review…</div>';
    div.classList.add('delta-mode');
    div.append(head, bar, deltaBody, body);
    if (DATA.preview)
      deltaBody.innerHTML = '<div class="empty">Changes-since-review diff '
        + 'renders from the server.</div>';
    else
    api('/api/reviewdelta?path=' + encodeURIComponent(path))
      .then(r => r.json())
      .then(d => {
        if (!d.available) {
          div.classList.remove('delta-mode');
          bar.remove();
          deltaBody.remove();
          return;
        }
        deltaBody.innerHTML = '';
        if (!d.hunks.length) {
          deltaBody.append(el('div', 'empty',
            'No content changes since your review — only its position in the diff moved.'));
          return;
        }
        d.hunks.forEach(h => {
          const hb = el('div', 'delta-hunk');
          const hh = el('div', 'hunk-head');
          hh.append(el('code', 'hunk-header', h.header));
          const hbody = el('div', 'hunk-body');
          hbody.innerHTML = h.html;
          hb.append(hh, hbody);
          deltaBody.append(hb);
        });
      })
      .catch(() => {
        div.classList.remove('delta-mode');
        bar.remove();
        deltaBody.remove();
      });
  } else {
    div.append(head, body);
  }
  collapsible(div, head);
  return div;
}

function sectionBlock(sec) {
  const key = 'section:' + sec.id;
  const wrap = el('section', 'sec');
  wrap.dataset.key = key;
  wrap.id = 'sec-' + sec.id;
  const head = el('div', 'sec-head');
  head.append(el('h2', '', sec.title));
  head.append(el('span', 'dots', dots(sec.difficulty)));
  const body = el('div', 'sec-body');
  if (sec.summary) body.append(el('p', 'summary', sec.summary));

  const list = el('div', 'file-list');
  body.append(list);
  const listEntry = (label, note, node) => {
    const a = el('a', 'file-list-item');
    a.append(el('code', '', label));
    if (note) a.append(el('span', 'muted', note));
    a.onclick = () => node.scrollIntoView();
    list.append(a);
  };

  (sec.files || []).forEach(f => {
    const fb = fileBlock(f);
    body.append(fb);
    const n = fileHunks(f).length;
    listEntry(f, n === 0 ? 'no longer in diff'
                         : n + (n === 1 ? ' hunk' : ' hunks'), fb);
  });
  (sec.extra_hunks || []).forEach(e => {
    const h = findHunk(e);
    if (!h) return;
    const hb = hunkBlock(e.file, h, true);
    body.append(hb);
    listEntry(e.file, 'hunk ' + e.index + ' only', hb);
  });

  const filesBtn = el('button', 'files-toggle', list.children.length + ' files');
  filesBtn.onclick = ev => {
    ev.stopPropagation();
    wrap.classList.remove('collapsed');
    wrap.classList.toggle('show-files');
  };
  head.append(filesBtn, markBtn(key));

  wrap.append(head, body);
  collapsible(wrap, head);
  return wrap;
}

function jumpToFile(secId, path) {
  const sec = document.getElementById('sec-' + secId);
  sec.classList.remove('collapsed');
  const target = [...sec.querySelectorAll('.file, .hunk.standalone')].find(n =>
    n.querySelector('.file-path')?.textContent === path);
  if (target) target.scrollIntoView();
}

// Group a flat path list into a nested {dirs, files} tree. No dependency —
// splitting paths on "/" is the whole job.
function fileTree(paths) {
  const root = { dirs: {}, files: [] };
  for (const p of paths) {
    const parts = p.split('/');
    const name = parts.pop();
    let node = root;
    for (const dir of parts) {
      node.dirs[dir] = node.dirs[dir] || { dirs: {}, files: [] };
      node = node.dirs[dir];
    }
    node.files.push({ name, path: p });
  }
  return root;
}

// Render dirs (folder rows) then files (clickable leaves), indented by depth.
// Single-child dir chains collapse into one row (src/components/…), GitHub-style.
function renderTree(node, sec, wrap, depth) {
  const pad = d => (d * 12 + 4) + 'px';
  for (let [name, child] of Object.entries(node.dirs)) {
    let label = name;
    while (Object.keys(child.dirs).length === 1 && child.files.length === 0) {
      const [n, c] = Object.entries(child.dirs)[0];
      label += '/' + n; child = c;
    }
    const d = el('div', 'nav-dir');
    d.style.paddingLeft = pad(depth);
    d.innerHTML = FA_FOLDER_OPEN;
    d.append(el('span', '', label));
    wrap.append(d);
    renderTree(child, sec, wrap, depth + 1);
  }
  for (const f of node.files) {
    const item = el('div', 'nav-file');
    item.dataset.fileReview = f.path;
    item.style.paddingLeft = (depth * 12 + 12) + 'px'; // +8 over pad(): files have no leading icon, align under folder labels
    item.title = f.path;
    item.append(el('span', 'nf-name', f.name));
    item.insertAdjacentHTML('beforeend', FA_CHECK);
    item.onclick = ev => { ev.stopPropagation(); jumpToFile(sec.id, f.path); };
    wrap.append(item);
  }
}

function navItem(sec) {
  const a = el('a', 'nav-item');
  a.dataset.navFor = 'section:' + sec.id;
  const t = el('div', 't', sec.title);
  const row = el('div', 'nav-title-row');
  row.append(t);
  row.insertAdjacentHTML('beforeend', FA_CHECK);
  a.append(row);
  const meta = el('div', 'meta');
  meta.append(el('span', 'dots', dots(sec.difficulty)));
  meta.append(el('span', 'prog', ''));
  a.append(meta);
  const bar = el('div', 'bar');
  bar.append(el('i', ''));
  a.append(bar);
  const filesWrap = el('div', 'nav-files');
  const paths = [...(sec.files || [])];
  (sec.extra_hunks || []).forEach(e => {
    if (!paths.includes(e.file)) paths.push(e.file);
  });
  renderTree(fileTree(paths), sec, filesWrap, 0);
  a.append(filesWrap);
  a.onclick = () => {
    // accordion: opening this section's file list closes any other open one
    const opening = !a.classList.contains('files-open');
    document.querySelectorAll('.nav-item.files-open')
      .forEach(n => n.classList.remove('files-open'));
    if (opening) a.classList.add('files-open');
    const s = document.getElementById('sec-' + sec.id);
    s.classList.remove('collapsed');
    s.scrollIntoView();
  };
  return a;
}

function applyState() {
  document.querySelectorAll('[data-key]').forEach(n =>
    n.classList.toggle('reviewed', !!state[n.dataset.key]));
  document.querySelectorAll('[data-mark-for]').forEach(b =>
    b.classList.toggle('on', !!state[b.dataset.markFor]));
  document.querySelectorAll('[data-file-review]').forEach(n =>
    n.classList.toggle('reviewed', fileReviewed(n.dataset.fileReview)));
  const overall = new Map();
  DATA.sections.forEach(sec => {
    const entries = coverEntries(sec);
    entries.forEach(en => overall.set(en.key, overall.get(en.key) || en.covered));
    const done = entries.filter(en => en.covered).length;
    const item = document.querySelector('[data-nav-for="section:' + sec.id + '"]');
    if (!item) return;
    item.classList.toggle('done', !!state['section:' + sec.id]);
    $('.prog', item).textContent = done + '/' + entries.length;
    $('.bar i', item).style.width = entries.length ? (100 * done / entries.length) + '%' : '0';
  });
  const doneAll = [...overall.values()].filter(Boolean).length;
  $('#overall').textContent = doneAll + ' of ' + overall.size + ' hunks reviewed';
  const badge = $('#fully-reviewed');
  const done = branchFullyReviewed(state);
  if (!badge.dataset.init) {  // build once so the width transition survives updates
    badge.dataset.init = '1';
    badge.innerHTML = '<span class="fr-label">In Review</span>'
                    + '<span class="fr-check">' + FA_CHECK + '</span>';
  }
  badge.classList.toggle('on', done);
}

// Fully reviewed = the changed-file list matches sections.json (the server
// injects an "_unsectioned" section whenever it doesn't) AND every hunk of
// every changed file is covered by its own mark or its file's mark.
function branchFullyReviewed(st) {
  if (DATA.sections.some(s => s.id === '_unsectioned')) return false;
  let any = false;
  for (const p of Object.keys(DATA.files)) {
    for (const h of fileHunks(p)) {
      any = true;
      if (!st[hunkKey(p, h)] && !st[fileKey(p)]) return false;
    }
  }
  return any;
}

function build() {
  document.title = DATA.title || 'PR Review';
  $('#title').textContent = DATA.title || 'PR Review';
  $('#sub').textContent = (DATA.branch || 'HEAD') + ' → ' + DATA.target;
  document.body.classList.toggle('can-comment', canComment);
  if (DATA.comments && DATA.comments.url) {
    // PR link lives at the far right of the top bar (most critical)
    const a = el('a', 'pr-link');
    a.innerHTML = '<span>PR #' + DATA.comments.pr + '</span>' + FA_UP_RIGHT;
    a.href = DATA.comments.url;
    a.target = '_blank';
    $('.tb-right').append(a);
  }
  DATA.sections.forEach(sec => {
    $('#sections-nav').append(navItem(sec));
    $('#content').append(sectionBlock(sec));
  });
  const cm = DATA.comments;
  if (cm && (cm.conversation || []).length) {
    const wrap = el('section', 'sec conv collapsed');
    const head = el('div', 'sec-head');
    head.append(el('h2', '', 'PR #' + cm.pr + ' conversation'));
    head.append(el('span', 'muted', cm.conversation.length + ' comments'));
    // refresh comments lives with the comments now, not the top bar
    const btn = el('button', 'refresh');
    btn.innerHTML = FA_REFRESH;
    btn.title = 'Refresh comments';
    btn.onclick = async ev => {
      ev.stopPropagation();  // don't toggle the section
      btn.disabled = true;
      btn.classList.add('busy');
      try {
        const r = await (await api('/api/refresh-comments', { method: 'POST' })).json();
        if (r.ok) { location.reload(); return; }
      } catch (e) { /* fall through to reset */ }
      btn.disabled = false;
      btn.classList.remove('busy');
    };
    head.append(btn);
    const pill = el('button', 'new-comments', 'New comments — reload');
    pill.style.display = 'none';
    pill.onclick = () => location.reload();
    const body = el('div', 'sec-body');
    cm.conversation.forEach(c => body.append(commentCard(c)));
    wrap.append(head, pill, body);
    collapsible(wrap, head);
    $('#content').prepend(wrap);
    setInterval(async () => {
      try {
        const r = await (await api('/api/comments-rev')).json();
        if (r.rev && r.rev !== DATA.comments_rev) pill.style.display = '';
      } catch (e) { /* server briefly away; try again next tick */ }
    }, 30000);
  }
  document.querySelectorAll('[data-key]').forEach(n => {
    if (state[n.dataset.key]) n.classList.add('collapsed');
  });
  applyState();
  trackStickyOffsets();
  // files with inline comments load eagerly so the comments are visible
  Object.keys(threadsByFile).forEach(ensureFile);
}

// Nested sticky headers park below their section header. Measure its real
// height into --sec-h per section instead of hard-coding it, so a font swap,
// padding tweak, or wrapping title can't desync the offset.
function trackStickyOffsets() {
  document.querySelectorAll('.sec').forEach(sec => {
    const head = sec.querySelector(':scope > .sec-head');
    if (!head) return;
    const set = () => sec.style.setProperty('--sec-h', head.offsetHeight + 'px');
    set();
    new ResizeObserver(set).observe(head);
  });
}
build();
</script>
</body>
</html>
